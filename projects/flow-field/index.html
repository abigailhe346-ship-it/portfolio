<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 22 C 10 14, 20 8, 28 7 C 24 12, 14 20, 5 24 Z%27 fill=%27%23c8442a%27/%3E%3C/svg%3E">
<title>Plein Air — No.01 · Wind over Wheat</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#4a3b2a}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
.title{position:fixed;left:24px;top:62px;z-index:10;pointer-events:none;mix-blend-mode:difference}
.title h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(26px,3.6vw,48px);color:#fff;margin:0;line-height:1.05}
.title p{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:8px 0 0}
.hud{position:fixed;right:24px;top:62px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);text-align:right;pointer-events:none;line-height:1.9;mix-blend-mode:difference}
.hint{position:fixed;left:24px;bottom:20px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);pointer-events:none;line-height:1.9;mix-blend-mode:difference}
.signet{position:fixed;right:22px;bottom:16px;z-index:90;display:flex;align-items:center;gap:10px;pointer-events:none}
.signet svg{width:38px;height:38px;display:block}
.signet span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c8442a;opacity:.92}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
#snd{position:fixed;right:24px;bottom:66px;z-index:95;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);background:none;border:1px solid rgba(255,255,255,.3);padding:6px 12px;cursor:pointer;mix-blend-mode:difference}
#snd:hover{border-color:#fff;color:#fff}
@media (max-width:760px){.hud{top:112px}.hint{font-size:9px;max-width:56vw}}
</style>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>Plein Air — No.01</span></div>
<canvas id="c"></canvas>
<div class="title"><h1>Wind over Wheat</h1><p>Gust-front study — after Auvers, 1890</p></div>
<div class="hud" id="hud"></div>
<div class="hint">move / drag — fan the wind · click / tap — time of day<br>G — summon gust · 1 / 2 / 3 — jump to moment</div>
<button id="snd">sound — off</button>
<div class="signet">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M12 44c1-12 8-26 22-31 8-3 16-2 20 2-7 1-14 6-19 13-6 8-9 17-16 20-4 2-7-1-7-4z" fill="#c8442a" opacity=".92"/>
    <path d="M14 53c9-2 22-5 32-13-3 7-15 14-27 15-5 .5-7-1-5-2z" fill="#c8442a" opacity=".55"/>
    <path d="M10 36c3-3 9-4 13-3-2 4-9 6-13 5-3-.6-3-1 0-2z" fill="#c8442a" opacity=".32"/>
  </svg>
  <span>Plein Air — No.01</span>
</div>
<svg class="grain" aria-hidden="true"><filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainF)"/></svg>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var hud=document.getElementById('hud');
var DPR=1,W=0,H=0,HOR=0;
var isMobile=(navigator.maxTouchPoints>0&&Math.min(innerWidth,innerHeight)<820)||Math.min(innerWidth,innerHeight)<640;

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix3(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}
function rgb2hsl(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(((h/60)%2)-1)),m=l-c/2,r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[(r+m)*255,(g+m)*255,(b+m)*255]}
function jit(c,deg){var q=rgb2hsl(c);return hsl2rgb(q[0]+deg,q[1],q[2])}

/* ---------- Perlin noise ---------- */
var perm=new Uint8Array(512);
(function(){var p=[],i;for(i=0;i<256;i++)p[i]=i;var seed=20260714;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(i=255;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}
for(i=0;i<512;i++)perm[i]=p[i&255]})();
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function grad(h,x,y,z){h&=15;var u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
function noise3(x,y,z){
  var X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
  var u=fade(x),v=fade(y),w=fade(z);
  var A=perm[X]+Y,AA=perm[A]+Z,AB=perm[A+1]+Z,B=perm[X+1]+Y,BA=perm[B]+Z,BB=perm[B+1]+Z;
  return lerp(lerp(lerp(grad(perm[AA],x,y,z),grad(perm[BA],x-1,y,z),u),lerp(grad(perm[AB],x,y-1,z),grad(perm[BB],x-1,y-1,z),u),v),
              lerp(lerp(grad(perm[AA+1],x,y,z-1),grad(perm[BA+1],x-1,y,z-1),u),lerp(grad(perm[AB+1],x,y-1,z-1),grad(perm[BB+1],x-1,y-1,z-1),u),v),w);
}

/* ---------- moments (three times of day) ---------- */
var MOMENTS=[
 {name:'Morning — Mist & Gold',skyT:'#f2e8cf',skyB:'#ecd9a8',sun:'#f5d98a',sunA:.5,gA:'#4a3b2a',gB:'#d9a441',mist:.5,mistC:'#f2e8cf',slots:['#d9a441','#c98f2e','#f2e8cf','#8d7fb8']},
 {name:'Dusk — Lavender',skyT:'#4a5a8a',skyB:'#c99a6b',sun:'#e07b39',sunA:.6,gA:'#2e2438',gB:'#8d7fb8',mist:.26,mistC:'#e8b7c3',slots:['#8d7fb8','#6f639e','#e07b39','#e8e4d8']},
 {name:'Before the Storm',skyT:'#39443c',skyB:'#93a48c',sun:'#dfe3da',sunA:.18,gA:'#1c2620',gB:'#5a7247',mist:.45,mistC:'#9fb2a8',slots:['#5a7247','#2e4a3f','#a8c5a0','#d9a441']}
];
var MN=MOMENTS.map(function(m){return{skyT:hx(m.skyT),skyB:hx(m.skyB),sun:hx(m.sun),gA:hx(m.gA),gB:hx(m.gB),mistC:hx(m.mistC),mist:m.mist,sunA:m.sunA,slots:m.slots.map(hx)}});
var moment=0,prevMoment=0,fadeK=1;

/* ---------- wheat stalks ---------- */
var stalks=[],slotFar=[],underpaint=[],skyMist=[];
function buildField(){
  stalks.length=0;underpaint.length=0;skyMist.length=0;slotFar.length=0;
  var mi,s;
  for(mi=0;mi<3;mi++){var row=[];for(s=0;s<4;s++)row.push(rgba(MN[mi].slots[s],.8));slotFar.push(row)}
  var n=clamp(Math.floor(W*H/(isMobile?1500:680)),500,isMobile?1500:3200);
  var i;
  for(i=0;i<n;i++){
    var x=Math.random()*W;
    var y=HOR+(H-HOR)*Math.pow(Math.random(),.62);
    var d=(y-HOR)/(H-HOR);
    var hh=lerp(7,Math.max(26,H*.052),Math.pow(d,1.12));
    var r=Math.random(),slot=r<.55?0:r<.75?1:r<.9?2:3;
    var jd=(Math.random()*2-1)*5;
    var cols=[];
    for(mi=0;mi<3;mi++)cols.push(rgba(jit(MN[mi].slots[slot],jd),lerp(.45,.92,d)));
    stalks.push({x:x,y:y,hh:hh,d:d,slot:slot,ph:Math.random()*6.283,cols:cols,far:d<.4});
  }
  stalks.sort(function(a,b){return a.d-b.d});
  for(i=0;i<34;i++)underpaint.push({x:Math.random()*W,y:HOR+(H-HOR)*Math.random(),rx:40+Math.random()*120,ry:8+Math.random()*22,slot:Math.floor(Math.random()*4)});
  for(i=0;i<5;i++)skyMist.push({x:Math.random()*W,y:HOR*(.15+Math.random()*.5),rx:120+Math.random()*200,ry:14+Math.random()*26,vx:6+Math.random()*10});
}

/* ---------- wind: gust queue + pointer fans ---------- */
var gusts=[],fans=[],nextGust=2.2,maxLean=0;
function spawnGust(){
  var dir=Math.random()<.5?1:-1;
  gusts.push({x:dir>0?-W*.25:W*1.25,v:dir*W*(.2+Math.random()*.28),w:W*(.07+Math.random()*.11),s:.5+Math.random()*.6,dir:dir});
}
function leanAt(x,y,t){
  var l=noise3(x*.0022,y*.0022,t*.14)*.14,i;
  for(i=0;i<gusts.length;i++){var g=gusts[i];
    var d=(x-g.x)/g.w;l+=g.dir*g.s*Math.exp(-d*d);
    var da=(x-(g.x+g.dir*g.w*2.4))/(g.w*1.5);l+=g.dir*g.s*.32*Math.exp(-da*da);
  }
  for(i=0;i<fans.length;i++){var f=fans[i];
    var dx=x-f.x,dy=y-f.y;
    l+=f.dx*f.s*Math.exp(-(dx*dx+dy*dy)/(f.R*f.R))*(1-f.age/f.life)*1.7;
  }
  return clamp(l,-1.4,1.4);
}

/* ---------- sound (procedural wind, off by default) ---------- */
var AC=null,windGain=null,windFilter=null,soundOn=false,sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',function(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0),last=0,i;
    for(i=0;i<len;i++){var wn=Math.random()*2-1;last=(last+.02*wn)/1.02;ch[i]=last*3.2}
    var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    windFilter=AC.createBiquadFilter();windFilter.type='bandpass';windFilter.frequency.value=480;windFilter.Q.value=.7;
    windGain=AC.createGain();windGain.gain.value=0;
    src.connect(windFilter);windFilter.connect(windGain);windGain.connect(AC.destination);src.start();
  }
  soundOn=!soundOn;
  sndBtn.textContent=soundOn?'sound — on':'sound — off';
  if(soundOn)AC.resume();
});

/* ---------- drawing ---------- */
function envMix(key){return mix3(MN[prevMoment][key],MN[moment][key],fadeK)}
function drawSky(){
  var skyT=envMix('skyT'),skyB=envMix('skyB'),sun=envMix('sun'),mistC=envMix('mistC');
  var g=ctx.createLinearGradient(0,0,0,HOR*1.1);
  g.addColorStop(0,rgba(skyT,1));g.addColorStop(1,rgba(skyB,1));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR*1.1+2);
  var sa=lerp(MN[prevMoment].sunA,MN[moment].sunA,fadeK);
  var sx=W*.72,sy=HOR-H*.15;
  var rg=ctx.createRadialGradient(sx,sy,0,sx,sy,H*.16);
  rg.addColorStop(0,rgba(sun,sa));rg.addColorStop(.4,rgba(sun,sa*.35));rg.addColorStop(1,rgba(sun,0));
  ctx.fillStyle=rg;ctx.fillRect(sx-H*.16,sy-H*.16,H*.32,H*.32);
  var ma=lerp(MN[prevMoment].mist,MN[moment].mist,fadeK),i;
  ctx.fillStyle=rgba(mistC,1);
  for(i=0;i<skyMist.length;i++){var m=skyMist[i];
    ctx.globalAlpha=ma*.28;
    ctx.beginPath();ctx.ellipse(m.x,m.y,m.rx,m.ry,0,0,6.284);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawUnderpaint(mi,k){
  var i;ctx.globalAlpha=k*.1;
  for(i=0;i<underpaint.length;i++){var u=underpaint[i];
    ctx.fillStyle=rgba(MN[mi].slots[u.slot],1);
    ctx.beginPath();ctx.ellipse(u.x,u.y,u.rx,u.ry,0,0,6.284);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawGround(){
  var gA=envMix('gA'),gB=envMix('gB');
  var g=ctx.createLinearGradient(0,HOR,0,H);
  g.addColorStop(0,rgba(gB,1));g.addColorStop(1,rgba(gA,1));
  ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H-HOR);
}
function drawStalks(mi,k,t){
  ctx.globalAlpha=k;
  var i,s,bx,by,lean,tx,ty,slot;
  for(slot=0;slot<4;slot++){
    ctx.strokeStyle=slotFar[mi][slot];ctx.lineWidth=1;ctx.beginPath();
    for(i=0;i<stalks.length;i++){s=stalks[i];if(!s.far||s.slot!==slot)continue;
      lean=leanAt(s.x,s.y,t)+Math.sin(t*2.6+s.ph)*.04;
      bx=s.x;by=s.y;tx=bx+lean*s.hh;ty=by-s.hh*(1-.12*Math.min(1,Math.abs(lean)));
      ctx.moveTo(bx,by);ctx.lineTo(tx,ty);
    }
    ctx.stroke();
  }
  for(i=0;i<stalks.length;i++){s=stalks[i];if(s.far)continue;
    lean=leanAt(s.x,s.y,t)+Math.sin(t*2.6+s.ph)*.05;
    bx=s.x;by=s.y;tx=bx+lean*s.hh;ty=by-s.hh*(1-.12*Math.min(1,Math.abs(lean)));
    var dx=tx-bx,dy=ty-by,len=Math.sqrt(dx*dx+dy*dy)||1,px=-dy/len,py=dx/len;
    var wb=.7+s.d*2.4,wt=.25;
    ctx.fillStyle=s.cols[mi];
    ctx.beginPath();
    ctx.moveTo(bx+px*wb,by+py*wb);ctx.lineTo(tx+px*wt,ty+py*wt);
    ctx.lineTo(tx-px*wt,ty-py*wt);ctx.lineTo(bx-px*wb,by-py*wb);ctx.closePath();
    if(s.d>.55){var hr=1+s.d*1.5;ctx.moveTo(tx+hr,ty);ctx.ellipse(tx,ty,hr,hr*.62,Math.atan2(dy,dx),0,6.284)}
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawGustStreaks(){
  if(!gusts.length)return;
  var mistC=envMix('mistC');
  ctx.strokeStyle=rgba(mistC,.12);ctx.lineWidth=1;ctx.beginPath();
  for(var i=0;i<gusts.length;i++){var g=gusts[i];
    for(var k=0;k<10;k++){
      var yy=(((Math.sin(k*12.99+g.x*.013)*43758.55)%1)+1)%1*H;
      var xx=g.x+(k-5)*g.w*.5;
      ctx.moveTo(xx,yy);ctx.lineTo(xx+g.dir*(40+k*8),yy-6);
    }
  }
  ctx.stroke();
}
function draw(dt,t){
  drawSky();
  drawUnderpaint(prevMoment,1);if(fadeK<1)drawUnderpaint(moment,fadeK);
  drawGround();
  drawGustStreaks();
  drawStalks(prevMoment,1,t);if(fadeK<1)drawStalks(moment,fadeK,t);
  maxLean*=.9;
  for(var i=0;i<skyMist.length;i++){var m=skyMist[i];m.x+=m.vx*dt;if(m.x-m.rx>W)m.x=-m.rx}
}

/* ---------- HUD ---------- */
var hudT=0;
function hudTick(dt){
  hudT-=dt;if(hudT>0)return;hudT=.2;
  var wind=gusts.length?'gust crossing ▸▸':'gust in '+Math.max(0,nextGust).toFixed(1)+'s';
  hud.innerHTML=MOMENTS[moment].name+'<br>'+wind+'<br>'+stalks.length+' strokes';
  if(windGain){
    var tgt=soundOn?Math.min(.2,.03+maxLean*.22):0;
    windGain.gain.setTargetAtTime(tgt,AC.currentTime,.15);
    windFilter.frequency.setTargetAtTime(320+maxLean*700,AC.currentTime,.2);
  }
}

/* ---------- input ---------- */
var lastP=null,downX=0,downY=0,downT=0;
function addFan(x,y,dx,dy){
  var sp=Math.sqrt(dx*dx+dy*dy);if(sp<2)return;
  fans.push({x:x,y:y,dx:dx/sp,s:clamp(sp/36,.08,1),age:0,life:1.3,R:150});
  if(fans.length>14)fans.shift();
  maxLean=Math.max(maxLean,clamp(sp/36,0,1));
}
canvas.addEventListener('pointerdown',function(e){downX=e.clientX;downY=e.clientY;downT=performance.now();lastP=[e.clientX,e.clientY]});
canvas.addEventListener('pointermove',function(e){
  if(lastP)addFan(e.clientX,e.clientY,e.clientX-lastP[0],e.clientY-lastP[1]);
  lastP=[e.clientX,e.clientY];
});
canvas.addEventListener('pointerup',function(e){
  lastP=null;
  var d=Math.sqrt(Math.pow(e.clientX-downX,2)+Math.pow(e.clientY-downY,2));
  if(d<10&&performance.now()-downT<450)setMoment((moment+1)%3);
});
canvas.addEventListener('pointercancel',function(){lastP=null});
function setMoment(m){if(m===moment)return;prevMoment=moment;moment=m;fadeK=0}
addEventListener('keydown',function(e){
  if(e.key==='g'||e.key==='G')spawnGust();
  else if(e.key==='1')setMoment(0);else if(e.key==='2')setMoment(1);else if(e.key==='3')setMoment(2);
});

/* ---------- loop / lifecycle ---------- */
var raf=null,t=0,last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  nextGust-=dt;if(nextGust<=0){spawnGust();nextGust=2.5+Math.random()*5}
  var i;
  for(i=gusts.length-1;i>=0;i--){gusts[i].x+=gusts[i].v*dt;if(gusts[i].x<-W*.35||gusts[i].x>W*1.35)gusts.splice(i,1)}
  for(i=fans.length-1;i>=0;i--){fans[i].age+=dt;if(fans[i].age>=fans[i].life)fans.splice(i,1)}
  if(fadeK<1)fadeK=Math.min(1,fadeK+dt/1.2);
  if(gusts.length)maxLean=Math.max(maxLean,.55);
  draw(dt,t);
  hudTick(dt);
  raf=requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;HOR=Math.round(H*.36);
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildField();
}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null;if(AC)AC.suspend()}
  else{if(AC&&soundOn)AC.resume();last=performance.now();if(!raf)raf=requestAnimationFrame(frame)}
});
resize();
raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
