<script type="importmap">
{

<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>Plein Air — No.16</span></div>
<canvas id="c"></canvas>
<div class="coord" id="coord">SECTOR 07 — RAIN 90% · WIND E</div>
<div class="ctlrow">
  <button class="ctlbtn" id="modeBtn">Dawn</button>
  <button class="ctlbtn" id="sndBtn">Sound · off</button>
</div>
<div class="seal">
  <svg viewBox="0 0 52 34" aria-hidden="true"><path d="M7 21C13 9 25 6 32 10c6 3.4 3.6 9.6-2.4 10.6-4.8.8-8.4-2.4-6.6-6.8" fill="none" stroke="#c8442a" stroke-width="4.4" stroke-linecap="round" opacity=".9"/><path d="M11 27.5c9.5-4.4 23-5.2 34-1.8" fill="none" stroke="#c8442a" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></svg>
  <span>Plein Air — No.16</span>
</div>
<div class="grain"></div>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const MOBILE = window.matchMedia('(pointer:coarse)').matches || window.innerWidth < 700;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.045);
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 220);

/* lights */
const amb = new THREE.AmbientLight(0x36405a, 0.55);
scene.add(amb);
const moon = new THREE.DirectionalLight(0x8fb0e0, 0.35);
moon.position.set(20, 40, 10);
scene.add(moon);

/* noise helpers */
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* city generation — 40×40 blocks, avenue every 6th column, cloned once in z for a seamless loop */
const COLS = 40, ROWS = 40, SP = 2, DEPTH = ROWS * SP - 2; // 78
const placements = [];
for (let ix = 0; ix < COLS; ix++) {
  if (ix % 6 === 0) continue; // avenue
  for (let iz = 0; iz < ROWS; iz++) {
    const n = vnoise(ix * 0.24, iz * 0.24);
    if (n < 0.2) continue; // empty lot
    const h = 0.9 + Math.pow(n, 1.7) * 9.5 + hash(ix * 3.7, iz * 1.3) * 0.6;
    const sx = 1.15 + hash(ix * 1.3, iz * 2.9) * 0.65;
    const sz = 1.15 + hash(ix * 2.1, iz * 1.7) * 0.65;
    const x = (ix - (COLS - 1) / 2) * SP;
    const z = 10 - iz * SP;
    placements.push({ x, z, sx, h, sz, tint: 0.85 + hash(ix * 5.1, iz * 4.3) * 0.25 });
    placements.push({ x, z: z - DEPTH, sx, h, sz, tint: 0.85 + hash(ix * 5.1, iz * 4.3) * 0.25 });
  }
}

const bldMat = new THREE.MeshStandardMaterial({ color: 0x1a1d23, roughness: 0.88, metalness: 0.08 });
const bldGeo = new THREE.BoxGeometry(1, 1, 1);
bldGeo.translate(0, 0.5, 0);
const buildings = new THREE.InstancedMesh(bldGeo, bldMat, placements.length);
{
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  placements.forEach((p, i) => {
    dummy.position.set(p.x, 0, p.z);
    dummy.scale.set(p.sx, p.h, p.sz);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    buildings.setMatrixAt(i, dummy.matrix);
    col.setScalar(p.tint);
    buildings.setColorAt(i, col);
  });
}
scene.add(buildings);

/* lit windows as one InstancedMesh of small emissive planes */
const winData = [];
const WARM = new THREE.Color(0xffd9a0);
const COOL = new THREE.Color(0xcfe4ff);
placements.forEach(p => {
  const rows = Math.max(1, Math.floor((p.h - 0.5) / 0.95));
  const faces = [
    { ax: 'x', sign: 1, w: p.sx, off: p.sz / 2 + 0.012, rotY: 0 },
    { ax: 'x', sign: -1, w: p.sx, off: p.sz / 2 + 0.012, rotY: Math.PI },
    { ax: 'z', sign: 1, w: p.sz, off: p.sx / 2 + 0.012, rotY: Math.PI / 2 },
    { ax: 'z', sign: -1, w: p.sz, off: p.sx / 2 + 0.012, rotY: -Math.PI / 2 }
  ];
  faces.forEach(f => {
    const cols = Math.max(1, Math.floor(f.w / 0.62));
    for (let r = 0; r < rows; r++) {
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        if (hash(p.x * 3.1 + r * 7.7, p.z * 1.9 + cIdx * 3.3 + f.rotY) > 0.32) continue;
        const u = ((cIdx + 0.5) / cols - 0.5) * (f.w - 0.5);
        const wy = 0.62 + r * 0.95;
        if (wy > p.h - 0.25) continue;
        let wx, wz;
        if (f.ax === 'x') { wx = p.x + u; wz = p.z + f.sign * f.off; }
        else { wx = p.x + f.sign * f.off; wz = p.z + u; }
        const cool = hash(wx * 9.7, wz * 6.3 + r) < 0.08;
        const inten = 0.45 + hash(wx * 4.9 + r, wz * 3.7 + cIdx) * 0.85;
        winData.push({ wx, wy, wz, rotY: f.rotY, cool, inten });
      }
    }
  });
});
const winMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const windows = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.15, 0.24), winMat, winData.length);
{
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  winData.forEach((w, i) => {
    dummy.position.set(w.wx, w.wy, w.wz);
    dummy.rotation.set(0, w.rotY, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    windows.setMatrixAt(i, dummy.matrix);
    col.copy(w.cool ? COOL : WARM).multiplyScalar(w.inten);
    windows.setColorAt(i, col);
  });
}
scene.add(windows);

/* wet-street reflections — windows smeared toward the viewer on the ground */
function makeFadeTexture() {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 128;
  const ctx = cv.getContext('2d');
  const gr = ctx.createLinearGradient(0, 0, 0, 128); // opaque at canvas top (v=1 → near edge)
  gr.addColorStop(0, 'rgba(255,255,255,.85)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 8, 128);
  return new THREE.CanvasTexture(cv);
}
const reflData = winData.filter(w => w.wy < 5.5 && hash(w.wx * 7.7 + w.wy * 3.3, w.wz * 3.1) < 0.38);
const reflGeo = new THREE.PlaneGeometry(0.16, 1);
reflGeo.translate(0, -0.5, 0);
const reflMat = new THREE.MeshBasicMaterial({
  map: makeFadeTexture(), transparent: true, opacity: 0.38,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false
});
const refls = new THREE.InstancedMesh(reflGeo, reflMat, reflData.length);
{
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  reflData.forEach((w, i) => {
    const L = 0.45 + w.wy * (0.55 + hash(w.wx * 3.7, w.wz * 9.1) * 0.35);
    dummy.position.set(w.wx, 0.02, w.wz + 0.15);
    dummy.rotation.set(-Math.PI / 2, 0, 0);
    dummy.scale.set(1, L, 1);
    dummy.updateMatrix();
    refls.setMatrixAt(i, dummy.matrix);
    col.copy(w.cool ? COOL : WARM).multiplyScalar(w.inten * 0.16);
    refls.setColorAt(i, col);
  });
}
scene.add(refls);

/* ground — dark and rain-slick */
const gndMat = new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 0.5, metalness: 0.15 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), gndMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.02, -60);
scene.add(ground);

/* rain — instanced slanted streaks cycling through a box that follows the camera */
const RAIN_N = MOBILE ? 650 : 1500;
const drops = [];
for (let i = 0; i < RAIN_N; i++) {
  drops.push({
    x: (Math.random() - 0.5) * 80,
    y: Math.random() * 24,
    z: 10 - Math.random() * 85,
    speed: 13 + Math.random() * 7,
    len: 0.5 + Math.random() * 0.4
  });
}
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_N * 6);
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({
  color: 0x9fb4cc, transparent: true, opacity: 0.32,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false;
scene.add(rain);

/* splash glints — tiny points that flash where drops land */
const SPL_N = MOBILE ? 120 : 240;
const splGeo = new THREE.BufferGeometry();
const splPos = new Float32Array(SPL_N * 3);
const splBirth = new Float32Array(SPL_N).fill(-10);
splGeo.setAttribute('position', new THREE.BufferAttribute(splPos, 3));
splGeo.setAttribute('aBirth', new THREE.BufferAttribute(splBirth, 1));
const splUniforms = { uTime: { value: 0 }, uScale: { value: 1 } };
const splMat = new THREE.ShaderMaterial({
  uniforms: splUniforms,
  vertexShader: `
    attribute float aBirth;
    uniform float uTime;
    uniform float uScale;
    varying float vA;
    void main() {
      float age = uTime - aBirth;
      float life = 0.45;
      float k = clamp(age / life, 0.0, 1.0);
      vA = (1.0 - k) * step(age, life) * step(0.0, age);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = mix(7.0, 1.5, k) * uScale / max(0.1, -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main() {
      float d = distance(gl_PointCoord, vec2(0.5));
      float a = pow(smoothstep(0.5, 0.0, d), 2.0) * vA * 0.85;
      gl_FragColor = vec4(vec3(0.82, 0.89, 1.0), a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const splashes = new THREE.Points(splGeo, splMat);
splashes.frustumCulled = false;
scene.add(splashes);
let splIdx = 0;
function spawnSplash(x, z, t) {
  splPos[splIdx * 3] = x;
  splPos[splIdx * 3 + 1] = 0.05;
  splPos[splIdx * 3 + 2] = z;
  splBirth[splIdx] = t;
  splGeo.attributes.position.needsUpdate = true;
  splGeo.attributes.aBirth.needsUpdate = true;
  splIdx = (splIdx + 1) % SPL_N;
}

/* car light streaks along the avenues */
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const gr = ctx.createRadialGradient(32, 32, 2, 32, 32, 31);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.35, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
function makeTrailTexture() {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 128;
  const ctx = cv.getContext('2d');
  const gr = ctx.createLinearGradient(0, 128, 0, 0); // opaque at canvas bottom (v=0 → +z after flat rotation)
  gr.addColorStop(0, 'rgba(255,255,255,.9)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 8, 128);
  return new THREE.CanvasTexture(cv);
}
const glowTex = makeGlowTexture();
const trailTex = makeTrailTexture();
const trailMats = [];
const cars = [];
const AVENUES = [];
for (let ix = 0; ix < COLS; ix += 6) AVENUES.push((ix - (COLS - 1) / 2) * SP);

function glowMesh(color, size) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false, side: THREE.DoubleSide })
  );
  m.rotation.x = -Math.PI / 2;
  return m;
}
AVENUES.forEach((ax, ai) => {
  const dir = ai % 2 === 0 ? -1 : 1;
  const lane = dir === -1 ? -0.55 : 0.55;
  const n = 2 + (ai % 2);
  for (let k = 0; k < n; k++) {
    const grp = new THREE.Group();
    const front = glowMesh(0xfff6e2, 0.5);
    front.position.set(0, 0.22, dir * 0.4);
    grp.add(front);
    const rear = glowMesh(0xff2416, 0.38);
    rear.position.set(0, 0.22, -dir * 0.35);
    grp.add(rear);
    const len = 2.6 + hash(ai * 3.3, k * 7.1) * 2.4;
    const tMat = new THREE.MeshBasicMaterial({
      map: trailTex, color: dir === 1 ? 0xffe9c8 : 0xff2018, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false,
      opacity: 0.85, side: THREE.DoubleSide
    });
    tMat.userData.base = 0.85;
    trailMats.push(tMat);
    const trail = new THREE.Mesh(new THREE.PlaneGeometry(0.13, len), tMat);
    trail.rotation.x = -Math.PI / 2;
    if (dir === -1) trail.scale.y = -1;
    trail.position.set(0, 0.2, dir * -(0.25 + len / 2));
    grp.add(trail);
    grp.position.x = ax + lane;
    grp.position.z = 12 - hash(ai * 11.3, k * 5.7) * 150;
    scene.add(grp);
    cars.push({ grp, dir, speed: 7 + hash(ai * 7.9, k * 3.1) * 7 });
  }
});

/* lightning — a distant strike whites the sky for a frame or two */
const flashCv = document.createElement('canvas');
flashCv.width = 256; flashCv.height = 64;
{
  const ctx = flashCv.getContext('2d');
  const gr = ctx.createLinearGradient(0, 64, 0, 0);
  gr.addColorStop(0, 'rgba(210,220,245,.9)');
  gr.addColorStop(1, 'rgba(210,220,245,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 256, 64);
}
const flashMat = new THREE.MeshBasicMaterial({
  map: new THREE.CanvasTexture(flashCv), transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false
});
const flashPlane = new THREE.Mesh(new THREE.PlaneGeometry(280, 60), flashMat);
flashPlane.position.set(0, 16, -100);
scene.add(flashPlane);
let nextBolt = 6 + Math.random() * 9;
let boltT = -1;
let boltCooldown = 0;
function strike(t) {
  if (boltT >= 0) return;
  boltT = 0;
  nextBolt = t + 7 + Math.random() * 11;
  thunder();
}

/* day / night blend */
const C = {
  fogN: new THREE.Color(0x05070d), fogD: new THREE.Color(0xc3d0e2),
  bldN: new THREE.Color(0x1a1d23), bldD: new THREE.Color(0x46505e),
  winN: new THREE.Color(0xffffff), winD: new THREE.Color(0x23272e),
  ambN: new THREE.Color(0x36405a), ambD: new THREE.Color(0xbccadf),
  moonN: new THREE.Color(0x8fb0e0), moonD: new THREE.Color(0xfff1dd),
  gndN: new THREE.Color(0x05070d), gndD: new THREE.Color(0x9fadc2),
  flash: new THREE.Color(0xcfd9f2)
};
let mode = 0, mixV = 0;
const modeBtn = document.getElementById('modeBtn');
const coordEl = document.getElementById('coord');
modeBtn.addEventListener('click', () => {
  mode = mode === 0 ? 1 : 0;
  modeBtn.textContent = mode === 1 ? 'Night' : 'Dawn';
});

/* procedural rain audio (off by default) */
let AC = null, soundOn = false, rainGain = null, patterGain = null, noiseBuf = null;
const sndBtn = document.getElementById('sndBtn');
function buildAudio() {
  const len = 2 * AC.sampleRate;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1500;
  rainGain = AC.createGain(); rainGain.gain.value = 0;
  src.connect(lp); lp.connect(rainGain); rainGain.connect(AC.destination);
  const src2 = AC.createBufferSource();
  src2.buffer = noiseBuf; src2.loop = true; src2.playbackRate.value = 1.7;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.8;
  patterGain = AC.createGain(); patterGain.gain.value = 0;
  src2.connect(bp); bp.connect(patterGain); patterGain.connect(AC.destination);
  src.start(); src2.start();
}
function thunder() {
  if (!soundOn || !AC) return;
  const t0 = AC.currentTime + 0.16;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(160, t0);
  f.frequency.exponentialRampToValueAtTime(48, t0 + 1.6);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.55, t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 2.1);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t0); src.stop(t0 + 2.2);
}
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  sndBtn.textContent = soundOn ? 'Sound · on' : 'Sound · off';
  if (soundOn && !AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    buildAudio();
  }
  if (AC) { if (soundOn) AC.resume(); else AC.suspend(); }
});

/* mouse look */
let mx = 0, my = 0, smx = 0, smy = 0;
window.addEventListener('pointermove', e => {
  mx = (e.clientX / window.innerWidth) * 2 - 1;
  my = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });

/* tap = call a strike */
canvas.addEventListener('pointerdown', () => {
  if (mode === 0 && boltCooldown <= 0) {
    strike(simT);
    boltCooldown = 0.7;
  }
});

/* camera flight + weather state */
let camZ = 8;
let simT = 0;
let rainTarget = 0.9, rainLevel = 0.9, rainTimer = 6;
let coordTimer = 0;

function updateUScale() {
  splUniforms.uScale.value = (window.innerHeight * DPR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
}
updateUScale();

/* loop */
let rafId = null;
let last = performance.now();

function tick(dt, t) {
  simT = t;
  splUniforms.uTime.value = t;
  boltCooldown = Math.max(0, boltCooldown - dt);

  /* weather state — the rain breathes, the wind veers */
  rainTimer -= dt;
  if (rainTimer <= 0) {
    rainTarget = 0.55 + Math.random() * 0.45;
    rainTimer = 8 + Math.random() * 7;
  }
  const rainGoal = mode === 1 ? 0 : rainTarget;
  rainLevel += (rainGoal - rainLevel) * Math.min(1, dt * 0.5);
  const windX = Math.sin(t * 0.11) * 1.2 + Math.sin(t * 0.031) * 1.8;

  mixV += (mode - mixV) * Math.min(1, dt * 1.7);
  scene.fog.color.lerpColors(C.fogN, C.fogD, mixV);
  scene.background.copy(scene.fog.color);
  scene.fog.density = 0.045 + (0.026 - 0.045) * mixV;
  bldMat.color.lerpColors(C.bldN, C.bldD, mixV);
  winMat.color.lerpColors(C.winN, C.winD, mixV);
  gndMat.color.lerpColors(C.gndN, C.gndD, mixV);
  gndMat.roughness = 0.5 + mixV * 0.5;
  amb.color.lerpColors(C.ambN, C.ambD, mixV);
  amb.intensity = 0.55 + 1.0 * mixV;
  moon.color.lerpColors(C.moonN, C.moonD, mixV);
  moon.intensity = 0.35 + 0.6 * mixV;
  trailMats.forEach(m => { m.opacity = m.userData.base * (1 - mixV * 0.65); });

  /* rain streaks */
  rainMat.opacity = 0.34 * rainLevel * (1 - mixV);
  if (rainLevel > 0.02 && mixV < 0.95) {
    const zb = camZ + 8, zf = camZ - 78;
    for (let i = 0; i < RAIN_N; i++) {
      const d = drops[i];
      d.y -= d.speed * dt * (0.7 + rainLevel * 0.5);
      d.x += windX * dt * 0.9;
      if (d.y < 0) {
        if (rainLevel > 0.3 && Math.random() < 0.5) spawnSplash(d.x, d.z, t);
        d.y = 17 + Math.random() * 8;
        d.x = (Math.random() - 0.5) * 80;
        d.z = zb - Math.random() * 86;
      }
      if (d.z > zb) d.z = zf + Math.random() * 4;
      const o = i * 6;
      const vl = Math.hypot(windX * 0.9, d.speed) || 1;
      const tx = -(windX * 0.9 / vl) * d.len;
      const ty = (d.speed / vl) * d.len;
      rainPos[o] = d.x; rainPos[o + 1] = d.y; rainPos[o + 2] = d.z;
      rainPos[o + 3] = d.x + tx; rainPos[o + 4] = d.y + ty; rainPos[o + 5] = d.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  /* reflections shimmer with the wet */
  reflMat.opacity = 0.38 * (1 - mixV) * (0.65 + 0.35 * rainLevel);

  /* lightning envelope — double pulse, then back to the dark */
  if (mode === 0 && t > nextBolt) strike(t);
  if (boltT >= 0) {
    boltT += dt;
    const p = (a, c, w) => Math.exp(-Math.pow((a - c) / w, 2));
    const I = Math.min(1, p(boltT, 0.06, 0.035) + 0.7 * p(boltT, 0.22, 0.05));
    scene.fog.color.lerp(C.flash, I * 0.85);
    scene.background.copy(scene.fog.color);
    amb.intensity += I * 2.6;
    moon.intensity += I * 1.4;
    flashMat.opacity = I * 0.85;
    flashPlane.position.z = camZ - 105;
    if (boltT > 0.55) { boltT = -1; flashMat.opacity = 0; }
  }

  /* audio follows the weather */
  if (soundOn && AC && rainGain) {
    rainGain.gain.value = 0.12 * rainLevel * (1 - mixV);
    patterGain.gain.value = 0.03 * rainLevel * (1 - mixV);
  }

  camZ -= dt * 4.2;
  if (camZ < -66) camZ += DEPTH;
  const camX = -3 + Math.sin(t * 0.22) * 0.4;
  const camY = 3.4 + Math.sin(t * 0.5) * 0.18;

  smx += (mx - smx) * 0.045;
  smy += (my - smy) * 0.045;

  cars.forEach(c => {
    c.grp.position.z += c.dir * c.speed * dt;
    if (c.dir < 0 && c.grp.position.z < -142) c.grp.position.z = 12;
    if (c.dir > 0 && c.grp.position.z > 12) c.grp.position.z = -142;
  });

  camera.position.set(camX, camY, camZ);
  camera.lookAt(camX + smx * 12, camY - 1.1 - smy * 4.5, camZ - 14);

  coordTimer -= dt;
  if (coordTimer <= 0) {
    coordTimer = 0.5;
    coordEl.textContent = mode === 1
      ? 'SECTOR 07 — DAWN · RAIN STOPPED'
      : `SECTOR 07 — RAIN ${Math.round(rainLevel * 100)}% · WIND ${windX >= 0 ? 'E' : 'W'}`;
  }

  renderer.render(scene, camera);
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateUScale();
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
