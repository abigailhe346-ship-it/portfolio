<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 22 C 10 14, 20 8, 28 7 C 24 12, 14 20, 5 24 Z%27 fill=%27%23c8442a%27/%3E%3C/svg%3E"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed')</script><style>.embed .topbar,.embed .signet{display:none!important}</style>
<title>Plein Air — No.02 · Dandelion</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f2e8cf}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
.title{position:fixed;left:24px;top:62px;z-index:10;pointer-events:none}
.title h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(26px,3.6vw,48px);color:#2a2e28;margin:0;line-height:1.05}
.title p{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(42,46,40,.55);margin:8px 0 0}
.hud{position:fixed;right:24px;top:62px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(42,46,40,.6);text-align:right;pointer-events:none;line-height:1.9}
.hint{position:fixed;left:24px;bottom:20px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(42,46,40,.5);pointer-events:none;line-height:1.9}
.wordwrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20}
#word{pointer-events:auto;background:transparent;border:none;border-bottom:1px dashed rgba(42,46,40,.4);color:#2a2e28;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.4em;text-transform:uppercase;text-align:center;padding:6px 4px;width:min(420px,64vw);outline:none}
#word:focus{border-bottom-color:#c8442a}
.signet{position:fixed;right:22px;bottom:16px;z-index:90;display:flex;align-items:center;gap:10px;pointer-events:none}
.signet svg{width:38px;height:38px;display:block}
.signet span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c8442a;opacity:.92}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;opacity:.05;mix-blend-mode:multiply}
@media (max-width:760px){.wordwrap{bottom:64px}.hint{display:none}.hud{top:112px}}
</style>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>Plein Air — No.02</span></div>
<canvas id="c"></canvas>
<div class="title"><h1>Dandelion</h1><p>Seed clock, spring physics — blow it apart</p></div>
<div class="hud" id="hud"></div>
<div class="hint">move / drag — blow · long-press — gale (seeds leave for good)<br>R / double-tap — regrow · tap — puff · type below to re-seed</div>
<div class="wordwrap"><input id="word" value="PLEIN AIR" maxlength="14" spellcheck="false" autocomplete="off"></div>
<div class="signet">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M12 44c1-12 8-26 22-31 8-3 16-2 20 2-7 1-14 6-19 13-6 8-9 17-16 20-4 2-7-1-7-4z" fill="#c8442a" opacity=".92"/>
    <path d="M14 53c9-2 22-5 32-13-3 7-15 14-27 15-5 .5-7-1-5-2z" fill="#c8442a" opacity=".55"/>
    <path d="M10 36c3-3 9-4 13-3-2 4-9 6-13 5-3-.6-3-1 0-2z" fill="#c8442a" opacity=".32"/>
  </svg>
  <span>Plein Air — No.02</span>
</div>
<svg class="grain" aria-hidden="true"><filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainF)"/></svg>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var hud=document.getElementById('hud'),input=document.getElementById('word');
var DPR=1,W=0,H=0;
var isMobile=(navigator.maxTouchPoints>0&&Math.min(innerWidth,innerHeight)<820)||Math.min(innerWidth,innerHeight)<640;
var INK=[42,46,40];

function clamp(v,a,b){return v<a?a:v>b?b:v}

/* ---------- Perlin noise ---------- */
var perm=new Uint8Array(512);
(function(){var p=[],i;for(i=0;i<256;i++)p[i]=i;var seed=97531;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(i=255;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}
for(i=0;i<512;i++)perm[i]=p[i&255]})();
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function lerpN(a,b,t){return a+(b-a)*t}
function grad(h,x,y,z){h&=15;var u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
function noise3(x,y,z){
  var X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
  var u=fade(x),v=fade(y),w=fade(z);
  var A=perm[X]+Y,AA=perm[A]+Z,AB=perm[A+1]+Z,B=perm[X+1]+Y,BA=perm[B]+Z,BB=perm[B+1]+Z;
  return lerpN(lerpN(lerpN(grad(perm[AA],x,y,z),grad(perm[BA],x-1,y,z),u),lerpN(grad(perm[AB],x,y-1,z),grad(perm[BB],x-1,y-1,z),u),v),
              lerpN(lerpN(grad(perm[AA+1],x,y,z-1),grad(perm[BA+1],x-1,y,z-1),u),lerpN(grad(perm[AB+1],x,y-1,z-1),grad(perm[BB+1],x-1,y-1,z-1),u),v),w);
}

/* ---------- seeds ---------- */
/* state: 0 spring-home · 1 airborne · 2 gone (lost) */
var seeds=[];
var SHADES=['rgba(42,46,40,.5)','rgba(42,46,40,.68)','rgba(42,46,40,.85)'];

function newSeed(spawnEdge){
  var x,y;
  if(spawnEdge){
    var side=Math.floor(Math.random()*3);
    if(side===0){x=-20;y=Math.random()*H}
    else if(side===1){x=W+20;y=Math.random()*H}
    else{x=Math.random()*W;y=-20}
  }else{x=Math.random()*W;y=Math.random()*H}
  return{x:x,y:y,hx:0,hy:0,vx:0,vy:0,rot:Math.random()*6.283,vr:(Math.random()-.5)*.1,
         state:1,shade:Math.floor(Math.random()*3),spin0:Math.random()*6.283,dead:false};
}

function sampleText(str){
  var oc=document.createElement('canvas');oc.width=W;oc.height=H;
  var o=oc.getContext('2d');
  var fs=Math.min(W*(isMobile?.24:.17),H*.3);
  o.font='italic 400 '+fs+'px "Instrument Serif",serif';
  var guard=0;
  while(o.measureText(str).width>W*.9&&fs>18&&guard++<40){fs*=.93;o.font='italic 400 '+fs+'px "Instrument Serif",serif'}
  o.fillStyle='#000';o.textAlign='center';o.textBaseline='middle';
  o.fillText(str,W/2,H*.46);
  var data;
  try{data=o.getImageData(0,0,W,H).data}catch(e){return[]}
  /* adaptive step — aim for a steady seed count whatever the font size */
  var tw=o.measureText(str).width,th=fs*.78;
  var target=isMobile?900:2600;
  var step=Math.max(3,Math.sqrt(tw*th*.45/target));
  var pts=[],x,y;
  for(y=0;y<H;y+=step)for(x=0;x<W;x+=step){
    if(data[(((y|0)*W)+(x|0))*4+3]>128)pts.push([x+(Math.random()-.5)*step,y+(Math.random()-.5)*step]);
  }
  var MAX=isMobile?1400:3200;
  if(pts.length>MAX){ /* shuffle then slice */
    for(var i=pts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pts[i];pts[i]=pts[j];pts[j]=t}
    pts.length=MAX;
  }
  return pts;
}

function setWord(str){
  var pts=sampleText(str);
  if(!pts.length)pts=[[W/2,H/2]];
  while(seeds.length<pts.length)seeds.push(newSeed(true));
  for(var i=0;i<seeds.length;i++){var s=seeds[i];
    if(i<pts.length){
      s.hx=pts[i][0];s.hy=pts[i][1];
      if(s.state===2){ /* a lost seed's home was recycled — it stays lost */ }
      else if(s.state!==1&&Math.abs(s.x-s.hx)>W)s.state=1;
    }else if(s.state!==2){s.state=2;s.vx=(Math.random()-.5)*3;s.vy=-1-Math.random()*2}
  }
}

function aliveCount(){var n=0;for(var i=0;i<seeds.length;i++)if(seeds[i].state!==2)n++;return n}

/* ---------- wind state ---------- */
var windX=0,windY=0,galeT=0,galeDir=1;
var nextBreeze=5,breezeT=0,breezeX=0,breezeY=0,status='calm';
var pw={x:0,y:0,vx:0,vy:0,s:0}; /* pointer wind, decays */

function fireGale(cx){
  galeDir=cx<W/2?1:-1;
  galeT=1.7;status='gale';
  for(var i=0;i<seeds.length;i++){var s=seeds[i];
    if(s.state===2)continue;
    if(Math.random()<.5){
      s.state=2;s.dead=false;
      s.vx=galeDir*(3+Math.random()*6);s.vy=(Math.random()-.5)*3-1;
    }else{
      s.state=1;s.vx+=galeDir*(2+Math.random()*4);s.vy+=(Math.random()-.5)*2;
    }
  }
}
function regrow(){
  for(var i=0;i<seeds.length;i++){var s=seeds[i];
    if(s.state===2){
      var ns=newSeed(true);
      s.x=ns.x;s.y=ns.y;s.dead=false;
      s.vx=(s.hx-s.x)*.02;s.vy=(s.hy-s.y)*.02;
      s.state=1;
    }
  }
}

/* ---------- input ---------- */
var charging=false,chargeT=0,chargeX=0,chargeY=0;
var lastP=null,lastTapT=0;
canvas.addEventListener('pointerdown',function(e){
  charging=true;chargeT=0;chargeX=e.clientX;chargeY=e.clientY;
  lastP=[e.clientX,e.clientY];
});
canvas.addEventListener('pointermove',function(e){
  if(lastP){
    var dx=e.clientX-lastP[0],dy=e.clientY-lastP[1];
    var sp=Math.sqrt(dx*dx+dy*dy);
    if(sp>1){
      pw.x=e.clientX;pw.y=e.clientY;
      pw.vx=dx;pw.vy=dy;
      pw.s=Math.min(1.6,pw.s+sp/30);
    }
  }
  lastP=[e.clientX,e.clientY];
});
canvas.addEventListener('pointerup',function(e){
  if(charging&&chargeT<.55){
    var now=performance.now();
    if(now-lastTapT<350){regrow();lastTapT=0}
    else{ /* puff: radial impulse */
      lastTapT=now;
      for(var i=0;i<seeds.length;i++){var s=seeds[i];
        if(s.state===2)continue;
        var dx=s.x-e.clientX,dy=s.y-e.clientY,r=Math.sqrt(dx*dx+dy*dy)||1;
        if(r<160){var f=(1-r/160)*3;s.vx+=dx/r*f;s.vy+=dy/r*f;s.state=1}
      }
    }
  }else if(charging){fireGale(chargeX)} /* released after a long press — let the gale go */
  charging=false;chargeT=0;lastP=null;
});
canvas.addEventListener('pointercancel',function(){charging=false;chargeT=0;lastP=null});
addEventListener('keydown',function(e){
  if(document.activeElement===input)return;
  if(e.key==='r'||e.key==='R')regrow();
});
var deb=null;
input.addEventListener('input',function(){
  clearTimeout(deb);
  deb=setTimeout(function(){setWord((input.value||'·').toUpperCase())},380);
});

/* ---------- update ---------- */
function update(dt,t){
  /* breeze scheduler — the world breathes on its own */
  nextBreeze-=dt;
  if(nextBreeze<=0&&galeT<=0){
    breezeT=1.4+Math.random()*1.2;
    breezeX=(Math.random()-.5)*1.6;breezeY=-.2-Math.random()*.4;
    nextBreeze=7+Math.random()*8;status='breeze';
  }
  if(breezeT>0){breezeT-=dt;windX=breezeX*breezeT;windY=breezeY*breezeT}
  else if(galeT>0){galeT-=dt;windX=galeDir*9*Math.min(1,galeT);windY=-.6;if(galeT<=0)status='calm'}
  else{windX*=.94;windY*=.94;if(status!=='calm'&&Math.abs(windX)<.05)status='calm'}

  if(charging){
    chargeT+=dt;
    if(chargeT>=1.4){fireGale(chargeX);charging=false;chargeT=0} /* held long enough — gale breaks on its own */
  }
  pw.s*=.9;

  var i,s;
  for(i=0;i<seeds.length;i++){s=seeds[i];
    if(s.state===2){
      if(s.dead)continue;
      var cz=noise3(s.x*.004,s.y*.004,t*.3);
      s.vx+=windX*.06+cz*.12;s.vy+=.015+cz*.05;
      s.vx*=.995;s.vy*=.995;
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr*3;
      if(s.x<-60||s.x>W+60||s.y<-60||s.y>H+60)s.dead=true;
      continue;
    }
    if(s.state===1){
      var cx=noise3(s.x*.004,s.y*.004,t*.3),cy=noise3(s.x*.004+31.7,s.y*.004,t*.3);
      s.vx+=windX*.05+cx*.14;s.vy+=.03+windY*.05+cy*.14;
      /* flutter */
      s.vx+=Math.sin(t*6+s.spin0)*.02;
      var dxh=s.hx-s.x,dyh=s.hy-s.y,dh=Math.sqrt(dxh*dxh+dyh*dyh)||1;
      var calm=Math.abs(windX)<.2&&pw.s<.12&&galeT<=0;
      if(calm){ /* ease toward a capped homing velocity — no orbiting */
        var des=Math.min(7,dh*.06);
        s.vx+=(dxh/dh*des-s.vx)*.09;
        s.vy+=(dyh/dh*des-s.vy)*.09;
      }else{s.vx*=.985;s.vy*=.985}
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr*3;
      if(calm&&dh<10){s.state=0;s.vx*=.25;s.vy*=.25}
      if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40){
        /* drifted off but not gale-lost: wrap back as returner */
        s.x=clamp(s.x,-30,W+30);s.y=clamp(s.y,-30,H+30);
        s.vx=dxh*.01;s.vy=dyh*.01;
      }
      continue;
    }
    /* state 0 — spring home, small damping, with bounce; breeze makes seeds tremble */
    s.vx+=(s.hx-s.x)*.014+windX*.02;s.vy+=(s.hy-s.y)*.014+windY*.02;
    s.vx*=.9;s.vy*=.9;
    s.x+=s.vx;s.y+=s.vy;
    s.rot+=s.vr;
  }
  /* pointer wind applies to nearby seeds */
  if(pw.s>.02){
    for(i=0;i<seeds.length;i++){s=seeds[i];
      if(s.state===2)continue;
      var dx=s.x-pw.x,dy=s.y-pw.y,r2=dx*dx+dy*dy;
      if(r2<16900){
        var f=(1-Math.sqrt(r2)/130)*pw.s*.55;
        s.vx+=pw.vx*.08*f;s.vy+=pw.vy*.08*f;
        if(pw.s>.35)s.state=1;
      }
    }
  }
}

/* ---------- draw ---------- */
function draw(t){
  ctx.fillStyle='#f2e8cf';ctx.fillRect(0,0,W,H);
  var b,s,i,k;
  for(b=0;b<3;b++){
    ctx.strokeStyle=SHADES[b];ctx.lineWidth=1;ctx.beginPath();
    for(i=0;i<seeds.length;i++){s=seeds[i];
      if(s.dead||s.shade!==b)continue;
      var sp=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
      var ang;
      if(sp>.4)ang=Math.atan2(s.vy,s.vx)+Math.PI; /* stem trails motion */
      else ang=-Math.PI/2+Math.sin(t*1.4+s.spin0)*.25;
      var sl=6+Math.min(6,sp*2);
      var tx2=s.x+Math.cos(ang)*sl,ty2=s.y+Math.sin(ang)*sl;
      ctx.moveTo(s.x,s.y);ctx.lineTo(tx2,ty2);
      for(k=0;k<5;k++){
        var a=k*1.2566+s.spin0+s.rot*.3;
        ctx.moveTo(tx2,ty2);
        ctx.lineTo(tx2+Math.cos(a)*2.6,ty2+Math.sin(a)*2.6);
      }
    }
    ctx.stroke();
  }
  /* gale charge ring */
  if(charging&&chargeT>.2){
    var p=Math.min(1,(chargeT-.2)/.8);
    ctx.strokeStyle='rgba(200,68,42,'+(0.65*(1-p*.4))+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(chargeX,chargeY,10+p*70,0,6.284);ctx.stroke();
    ctx.strokeStyle='rgba(200,68,42,.3)';
    ctx.beginPath();ctx.arc(chargeX,chargeY,10+p*46,0,6.284);ctx.stroke();
  }
  /* gale streaks */
  if(galeT>0){
    ctx.strokeStyle='rgba(42,46,40,.12)';ctx.lineWidth=1;ctx.beginPath();
    for(i=0;i<16;i++){
      var yy=((Math.sin(i*78.23+t*9)*43758.55)%1+1)%1*H;
      var xx=((i*137.3+t*1400*galeDir)% (W+200)+(W+200))%(W+200)-100;
      ctx.moveTo(xx,yy);ctx.lineTo(xx+galeDir*70,yy-4);
    }
    ctx.stroke();
  }
}

/* ---------- HUD ---------- */
var hudT=0;
function hudTick(dt){
  hudT-=dt;if(hudT>0)return;hudT=.2;
  hud.innerHTML=aliveCount()+' / '+seeds.length+' seeds<br>'+status+
    (status==='calm'?'<br>breeze in '+Math.max(0,nextBreeze).toFixed(1)+'s':'');
}

/* ---------- loop / lifecycle ---------- */
var raf=null,t=0,last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  update(dt,t);
  draw(t);
  hudTick(dt);
  raf=requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  setWord((input.value||'PLEIN AIR').toUpperCase());
}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null}
  else{last=performance.now();if(!raf)raf=requestAnimationFrame(frame)}
});
function boot(){
  if(raf)return;
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  setWord('PLEIN AIR');
  raf=requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){
  document.fonts.load('italic 400 100px "Instrument Serif"').then(boot,boot);
  setTimeout(function(){if(!raf)boot()},1200);
}else boot();
})();
</script>
</body>
