<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Viewer — 3D—01</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 28%,#17181d 0%,#0a0a0c 60%,#060607 100%);font-family:'Space Grotesk',sans-serif;color:#ece9e2;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
.brand{position:fixed;left:34px;bottom:120px;pointer-events:none;user-select:none;z-index:5}
.brand h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(58px,9vw,118px);line-height:.88;color:#f2efe8}
.brand p{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;color:rgba(236,233,226,.45)}
.ui{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;z-index:10;max-width:94vw}
.mats{display:flex;gap:6px}
.pill{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(236,233,226,.6);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 15px;cursor:pointer;transition:color .25s ease,border-color .25s ease,background .25s ease}
.pill:hover{color:#fff;border-color:rgba(255,255,255,.42)}
.pill.active{background:#ece9e2;color:#0a0a0c;border-color:#ece9e2}
.swatches{display:flex;gap:10px;align-items:center;padding-left:16px;border-left:1px solid rgba(255,255,255,.12)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:var(--c);cursor:pointer;transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.sw:hover{transform:scale(1.18)}
.sw.active{box-shadow:0 0 0 2px #0a0a0c,0 0 0 3.5px #ece9e2}
.stats{position:fixed;right:26px;bottom:30px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:rgba(236,233,226,.42);z-index:10;pointer-events:none}
@media(max-width:680px){
  .brand{left:20px;bottom:158px}
  .brand h1{font-size:56px}
  .stats{display:none}
  .ui{gap:10px;bottom:18px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>3D—01 · Product Viewer</span></div>
<canvas id="c"></canvas>
<div class="brand"><h1>Noé</h1><p>EAU DE PARFUM · 50 ML</p></div>
<div class="ui">
  <div class="mats">
    <button class="pill active" data-mat="glass">Glass</button>
    <button class="pill" data-mat="metal">Brushed Metal</button>
    <button class="pill" data-mat="ceramic">Matte Ceramic</button>
  </div>
  <div class="swatches">
    <button class="sw active" data-c="#d9b08c" style="--c:#d9b08c" aria-label="amber"></button>
    <button class="sw" data-c="#a8c3d1" style="--c:#a8c3d1" aria-label="glacier"></button>
    <button class="sw" data-c="#e8e4dd" style="--c:#e8e4dd" aria-label="porcelain"></button>
    <button class="sw" data-c="#3c414c" style="--c:#3c414c" aria-label="noir"></button>
  </div>
</div>
<div class="stats"><span id="tris">······</span> TRIS</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.info.autoReset = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(3.1, 1.9, 4.3);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.06).texture;
pmrem.dispose();

/* three-point lighting */
const key = new THREE.SpotLight(0xffffff, 3.4, 0, 0.55, 0.6, 0);
key.position.set(4, 6.5, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.5);
fill.position.set(-5, 3, -1.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(-1.5, 5, -6);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x30323a, 0.55));

/* procedural perfume bottle */
const profilePts = [
  [0.0, 0.0], [0.30, 0.0], [0.44, 0.015], [0.52, 0.09], [0.568, 0.26],
  [0.585, 0.5], [0.565, 0.78], [0.51, 1.0], [0.415, 1.17], [0.305, 1.28],
  [0.24, 1.36], [0.218, 1.44], [0.212, 1.5]
].map(p => new THREE.Vector2(p[0], p[1]));

const bottle = new THREE.Group();
const body = new THREE.Mesh(new THREE.LatheGeometry(profilePts, 96));
bottle.add(body);

const capMat = new THREE.MeshPhysicalMaterial({ color: 0xcfc8ba, metalness: 1, roughness: 0.26, envMapIntensity: 1.1 });
const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.262, 0.262, 0.4, 64), capMat);
cap.position.y = 1.72;
bottle.add(cap);
const collar = new THREE.Mesh(new THREE.TorusGeometry(0.222, 0.026, 24, 96), capMat);
collar.rotation.x = Math.PI / 2;
collar.position.y = 1.51;
bottle.add(collar);
scene.add(bottle);

/* mirror floor + vignette veil */
const mirror = new Reflector(new THREE.CircleGeometry(9, 72), {
  clipBias: 0.003,
  textureWidth: Math.floor(window.innerWidth * DPR),
  textureHeight: Math.floor(window.innerHeight * DPR),
  color: 0x1c1d22
});
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);

const gc = document.createElement('canvas');
gc.width = gc.height = 512;
const g2 = gc.getContext('2d');
const grad = g2.createRadialGradient(256, 256, 30, 256, 256, 256);
grad.addColorStop(0, 'rgba(10,10,12,0.05)');
grad.addColorStop(0.45, 'rgba(10,10,12,0.34)');
grad.addColorStop(1, 'rgba(10,10,12,1)');
g2.fillStyle = grad;
g2.fillRect(0, 0, 512, 512);
const veil = new THREE.Mesh(
  new THREE.CircleGeometry(9, 72),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false })
);
veil.rotation.x = -Math.PI / 2;
veil.position.y = 0.002;
scene.add(veil);

/* materials */
const MATS = {
  glass: c => new THREE.MeshPhysicalMaterial({
    color: c, metalness: 0, roughness: 0.05, transmission: 1, thickness: 1.1, ior: 1.45,
    attenuationColor: new THREE.Color(c), attenuationDistance: 1.6,
    clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.15
  }),
  metal: c => new THREE.MeshPhysicalMaterial({ color: c, metalness: 1, roughness: 0.3, envMapIntensity: 1.15 }),
  ceramic: c => new THREE.MeshPhysicalMaterial({ color: c, metalness: 0, roughness: 0.9, envMapIntensity: 0.7 })
};
let curMat = 'glass';
let curColor = '#d9b08c';
function applyMaterial() {
  const m = MATS[curMat](curColor);
  if (body.material) body.material.dispose();
  body.material = m;
}
applyMaterial();

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curMat = btn.dataset.mat;
    applyMaterial();
  });
});
document.querySelectorAll('.sw').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sw').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curColor = btn.dataset.c;
    applyMaterial();
  });
});

/* controls */
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.4;
controls.maxDistance = 8;
controls.maxPolarAngle = 1.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
let resumeT = null;
controls.addEventListener('start', () => { controls.autoRotate = false; if (resumeT) clearTimeout(resumeT); });
controls.addEventListener('end', () => { resumeT = setTimeout(() => { controls.autoRotate = true; }, 2600); });

/* loop */
const trisEl = document.getElementById('tris');
let rafId = null;
let last = performance.now();
let frame = 0;

function tick() {
  controls.update();
  renderer.info.reset();
  renderer.render(scene, camera);
  frame++;
  if (frame % 30 === 0) trisEl.textContent = renderer.info.render.triangles.toLocaleString('en-US');
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  last = now;
  tick();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  mirror.getRenderTarget().setSize(
    Math.floor(window.innerWidth * DPR),
    Math.floor(window.innerHeight * DPR)
  );
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
