<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob Sculpture — 3D—02</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.42);pointer-events:none;user-select:none;white-space:nowrap}
.tag{position:fixed;left:26px;bottom:26px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);pointer-events:none;user-select:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>3D—02 · Blob Sculpture</span></div>
<canvas id="c"></canvas>
<div class="tag">Study Nº2 — Iridescent Form</div>
<div class="hint">drag to rotate · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.06).texture;
pmrem.dispose();

/* sculptural narrow spotlight from above */
const spot = new THREE.SpotLight(0xffffff, 4.2, 0, 0.32, 0.55, 0);
spot.position.set(1.6, 7.5, 2.2);
scene.add(spot);
scene.add(new THREE.AmbientLight(0x1c2028, 0.7));
const rim = new THREE.DirectionalLight(0x93a7ff, 0.35);
rim.position.set(-4, -2, -5);
scene.add(rim);

/* gpu-displaced blob */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;

const uniforms = {
  uTime: { value: 0 },
  uFreq: { value: 1.9 },
  uAmp: { value: 0.3 }
};

const mat = new THREE.MeshPhysicalMaterial({
  color: 0x2c2e36,
  metalness: 0.25,
  roughness: 0.2,
  iridescence: 1.0,
  iridescenceIOR: 1.35,
  clearcoat: 1.0,
  clearcoatRoughness: 0.14,
  envMapIntensity: 0.65
});
mat.onBeforeCompile = shader => {
  shader.uniforms.uTime = uniforms.uTime;
  shader.uniforms.uFreq = uniforms.uFreq;
  shader.uniforms.uAmp = uniforms.uAmp;
  shader.vertexShader = NOISE + '\nuniform float uTime;\nuniform float uFreq;\nuniform float uAmp;\n' + shader.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec3 nrm0 = normalize(position);
      vec3 tangA = normalize(abs(nrm0.y) > 0.98 ? cross(nrm0, vec3(1.0, 0.0, 0.0)) : cross(nrm0, vec3(0.0, 1.0, 0.0)));
      vec3 tangB = normalize(cross(nrm0, tangA));
      float epsT = 0.012;
      float tN = uTime * 0.22;
      float nz0 = snoise(position * uFreq + tN) * uAmp;
      vec3 disp0 = position + nrm0 * nz0;
      vec3 pA = position + tangA * epsT;
      float nzA = snoise(pA * uFreq + tN) * uAmp;
      vec3 dispA = pA + normalize(pA) * nzA;
      vec3 pB = position + tangB * epsT;
      float nzB = snoise(pB * uFreq + tN) * uAmp;
      vec3 dispB = pB + normalize(pB) * nzB;
      vec3 objectNormal = normalize(cross(dispA - disp0, dispB - disp0));
      objectNormal *= sign(dot(objectNormal, nrm0));
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3( tangent.xyz );
      #endif
    `)
    .replace('#include <begin_vertex>', 'vec3 transformed = disp0;');
};

const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 64), mat);
const group = new THREE.Group();
group.add(blob);
scene.add(group);

/* inertial drag + zoom */
let rotX = 0.35, rotY = 0, velX = 0, velY = 0;
let radius = 3.4, targetR = 3.4;
const BASE_SPIN = 0.0016;
const pointers = new Map();
let pinchDist = 0;

function clampR(v) { return Math.min(7.5, Math.max(2.1, v)); }

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('grabbing');
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    velY = (e.clientX - prev.x) * 0.0052;
    velX = (e.clientY - prev.y) * 0.0052;
    rotY += velY;
    rotX += velX;
    rotX = Math.min(1.15, Math.max(-1.15, rotX));
  } else if (pointers.size === 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchDist > 0) targetR = clampR(targetR * pinchDist / d);
    pinchDist = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) canvas.classList.remove('grabbing');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetR = clampR(targetR + e.deltaY * 0.0028);
}, { passive: false });

/* loop */
let rafId = null;
let last = performance.now();

function tick(t) {
  uniforms.uTime.value = t;
  if (pointers.size === 0) {
    rotY += velY + BASE_SPIN;
    rotX += velX;
    rotX = Math.min(1.15, Math.max(-1.15, rotX));
    velX *= 0.95;
    velY *= 0.95;
  }
  radius += (targetR - radius) * 0.08;
  group.rotation.set(rotX, rotY, 0);
  group.position.y = Math.sin(t * 0.45) * 0.06;
  camera.position.set(0, 0.3, radius);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tick(now / 1000, dt);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
