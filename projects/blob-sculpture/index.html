<script type="importmap">

<body>

<div class="seal">
  <svg viewBox="0 0 52 34" aria-hidden="true"><path d="M7 21C13 9 25 6 32 10c6 3.4 3.6 9.6-2.4 10.6-4.8.8-8.4-2.4-6.6-6.8" fill="none" stroke="#c8442a" stroke-width="4.4" stroke-linecap="round" opacity=".9"/><path d="M11 27.5c9.5-4.4 23-5.2 34-1.8" fill="none" stroke="#c8442a" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></svg>
  <span>Plein Air — No.15</span>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const MOBILE = window.matchMedia('(pointer:coarse)').matches || window.innerWidth < 700;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a2140, 0.022);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

/* twilight sky gradient */
{
  const bgc = document.createElement('canvas');
  bgc.width = 2; bgc.height = 512;
  const b = bgc.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#0d1126');
  g.addColorStop(0.5, '#1c2340');
  g.addColorStop(0.78, '#3a4a7a');
  g.addColorStop(0.92, '#5c5468');
  g.addColorStop(1, '#6e4a38');
  b.fillStyle = g;
  b.fillRect(0, 0, 2, 512);
  const bgTex = new THREE.CanvasTexture(bgc);
  bgTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = bgTex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

/* moon + dusk lights */
const moonLight = new THREE.DirectionalLight(0xdfe4f0, 1.15);
moonLight.position.set(-10, 12, -16);
scene.add(moonLight);
const ember = new THREE.DirectionalLight(0xe07b39, 0.3);
ember.position.set(14, 2.5, 10);
scene.add(ember);
scene.add(new THREE.AmbientLight(0x2a3652, 0.55));

function makeGlowSprite(inner, outer, size) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 63);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, outer);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true
  }));
  spr.scale.setScalar(size);
  return spr;
}
const moonGlow = makeGlowSprite('rgba(240,238,226,0.95)', 'rgba(200,210,235,0.28)', 16);
moonGlow.position.set(-34, 26, -54);
scene.add(moonGlow);
const moonCore = makeGlowSprite('rgba(255,255,248,1)', 'rgba(232,228,216,0.5)', 4.5);
moonCore.position.copy(moonGlow.position);
scene.add(moonCore);

/* ---------- water surface ---------- */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;

const RIP_N = 10;
const rippleVecs = [];
for (let i = 0; i < RIP_N; i++) rippleVecs.push(new THREE.Vector4(0, 0, -100, 0));

const uniforms = {
  uTime: { value: 0 },
  uAmp: { value: 0.9 },
  uRipples: { value: rippleVecs }
};

/* wave model — object space p = (x, -worldZ); JS mirror below for the lilies */
const WAVE_GLSL = `
uniform float uTime;
uniform float uAmp;
uniform vec4 uRipples[${RIP_N}];
float waveH(vec2 p){
  float h = 0.0;
  h += 0.055 * sin(dot(p, vec2(1.6, 0.48)) + uTime * 1.3);
  h += 0.035 * sin(dot(p, vec2(-1.38, 2.3)) + uTime * 1.7);
  h += 0.020 * sin(dot(p, vec2(0.68, -3.4)) + uTime * 2.2);
  h += 0.070 * sin(dot(p, vec2(-0.8, -0.32)) + uTime * 0.8);
  h += 0.018 * snoise(vec3(p * 0.55, uTime * 0.25));
  h *= uAmp;
  for (int i = 0; i < ${RIP_N}; i++) {
    vec4 R = uRipples[i];
    float age = uTime - R.z;
    if (age > 0.0 && age < 4.0) {
      float d = distance(p, R.xy);
      h += R.w * exp(-d * 1.1 - age * 1.5) * sin(d * 12.0 - age * 8.0) * smoothstep(0.0, 0.1, age);
    }
  }
  return h;
}
`;

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x1e3a32,
  metalness: 0,
  roughness: 0.14,
  transmission: 0.5,
  thickness: 1.4,
  ior: 1.33,
  attenuationColor: new THREE.Color(0x2e4a3f),
  attenuationDistance: 2.5,
  clearcoat: 0.8,
  clearcoatRoughness: 0.2,
  envMapIntensity: 0.5
});
waterMat.onBeforeCompile = shader => {
  shader.uniforms.uTime = uniforms.uTime;
  shader.uniforms.uAmp = uniforms.uAmp;
  shader.uniforms.uRipples = uniforms.uRipples;
  shader.vertexShader = NOISE + WAVE_GLSL + '\nfloat g_hC;\n' + shader.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec2 wp = position.xy;
      float e2 = 0.09;
      float hC = waveH(wp);
      float hX = waveH(wp + vec2(e2, 0.0));
      float hY = waveH(wp + vec2(0.0, e2));
      vec3 objectNormal = normalize(cross(vec3(e2, 0.0, hX - hC), vec3(0.0, e2, hY - hC)));
      g_hC = hC;
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3( tangent.xyz );
      #endif
    `)
    .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position.xy, g_hC);');
};

const SEG = MOBILE ? 120 : 220;
const water = new THREE.Mesh(new THREE.PlaneGeometry(64, 64, SEG, SEG), waterMat);
water.rotation.x = -Math.PI / 2;
scene.add(water);

/* JS mirror of the wave model (world x,z in; used to float the lilies) */
let gustAmp = 0.9;
let simT = 0;
function waveJS(wx, wz) {
  const x = wx, y = -wz;
  let h = 0;
  h += 0.055 * Math.sin(x * 1.6 + y * 0.48 + simT * 1.3);
  h += 0.035 * Math.sin(x * -1.38 + y * 2.3 + simT * 1.7);
  h += 0.020 * Math.sin(x * 0.68 + y * -3.4 + simT * 2.2);
  h += 0.070 * Math.sin(x * -0.8 + y * -0.32 + simT * 0.8);
  h *= gustAmp;
  for (let i = 0; i < RIP_N; i++) {
    const R = rippleVecs[i];
    const age = simT - R.z;
    if (age > 0 && age < 4) {
      const d = Math.hypot(x - R.x, y - R.y);
      const k = Math.min(1, age / 0.1);
      h += R.w * Math.exp(-d * 1.1 - age * 1.5) * Math.sin(d * 12 - age * 8) * k * k * (3 - 2 * k);
    }
  }
  return h;
}

/* ripple queue — world (x,z) in, stored in object space */
let ripIdx = 0;
function addRipple(wx, wz, amp) {
  rippleVecs[ripIdx].set(wx, -wz, simT, amp);
  ripIdx = (ripIdx + 1) % RIP_N;
}

/* ---------- procedural water lilies ---------- */
function makePad() {
  const g = new THREE.CircleGeometry(0.55, 20, 0.5, Math.PI * 2 - 0.85);
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cIn = new THREE.Color(0x4a7a58);
  const cOut = new THREE.Color(0x274d36);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.min(1, Math.hypot(x, y) / 0.55);
    pos.setZ(i, r * r * 0.12);
    tmp.lerpColors(cIn, cOut, r);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0 }));
  m.rotation.x = -Math.PI / 2;
  return m;
}
const petalGeo = new THREE.SphereGeometry(0.5, 8, 6);
petalGeo.scale(0.16, 0.05, 0.42);
petalGeo.translate(0, 0, 0.24);
const petalMat = new THREE.MeshStandardMaterial({ color: 0xe8b7c3, roughness: 0.55, metalness: 0 });
const coreMat = new THREE.MeshStandardMaterial({ color: 0xf2e8cf, roughness: 0.6, emissive: 0x332a18, emissiveIntensity: 0.4 });
function makeFlower() {
  const grp = new THREE.Group();
  for (let i = 0; i < 9; i++) {
    const holder = new THREE.Group();
    holder.rotation.y = (i / 9) * Math.PI * 2;
    const p = new THREE.Mesh(petalGeo, petalMat);
    p.rotation.x = -0.42;
    holder.add(p);
    grp.add(holder);
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), coreMat);
  core.position.y = 0.05;
  grp.add(core);
  grp.position.y = 0.1;
  return grp;
}
const lilySpots = [
  { x: -2.2, z: -1.5, flower: true, s: 1.0 },
  { x: 2.6, z: -2.8, flower: false, s: 0.85 },
  { x: -3.4, z: 2.2, flower: true, s: 1.15 },
  { x: 1.8, z: 2.4, flower: false, s: 0.7 },
  { x: 0.3, z: -4.2, flower: true, s: 0.9 }
].slice(0, MOBILE ? 3 : 5);
const lilies = lilySpots.map(L => {
  const grp = new THREE.Group();
  grp.add(makePad());
  if (L.flower) grp.add(makeFlower());
  grp.scale.setScalar(L.s);
  grp.position.set(L.x, 0, L.z);
  scene.add(grp);
  return { grp, x: L.x, z: L.z };
});

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitP = new THREE.Vector3();
function waterPoint(cx, cy) {
  ndc.set((cx / window.innerWidth) * 2 - 1, -((cy / window.innerHeight) * 2 - 1));
  ray.setFromCamera(ndc, camera);
  const p = ray.ray.intersectPlane(waterPlane, hitP);
  if (p && Math.abs(p.x) < 28 && Math.abs(p.z) < 28) return p;
  return null;
}

let mx = 0, my = 0, smx = 0, smy = 0;
let lastRipP = { x: 999, z: 999 };
let lastRipT = 0;
let lastPX = 0, lastPY = 0;

window.addEventListener('pointermove', e => {
  mx = (e.clientX / window.innerWidth) * 2 - 1;
  my = (e.clientY / window.innerHeight) * 2 - 1;
  const p = waterPoint(e.clientX, e.clientY);
  if (!p) return;
  const now = performance.now();
  const speed = Math.hypot(e.clientX - lastPX, e.clientY - lastPY);
  lastPX = e.clientX; lastPY = e.clientY;
  if (Math.hypot(p.x - lastRipP.x, p.z - lastRipP.z) > 0.45 || now - lastRipT > 140) {
    addRipple(p.x, p.z, Math.min(0.12, 0.045 + speed * 0.0012));
    lastRipP = { x: p.x, z: p.z };
    lastRipT = now;
  }
}, { passive: true });

canvas.addEventListener('pointerdown', e => {
  const p = waterPoint(e.clientX, e.clientY);
  if (p) {
    addRipple(p.x, p.z, 0.24);
    plink(0.5);
  }
});

/* zoom — wheel + pinch */
let radius = 4.8, targetR = 4.8;
const pointers = new Map();
let pinchDist = 0;
function clampR(v) { return Math.min(9.5, Math.max(2.6, v)); }
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchDist > 0) targetR = clampR(targetR * pinchDist / d);
    pinchDist = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetR = clampR(targetR + e.deltaY * 0.0028);
}, { passive: false });

/* ---------- procedural pond audio (off by default) ---------- */
let AC = null, soundOn = false, noiseBuf = null;
const sndBtn = document.getElementById('sndBtn');
function buildAudio() {
  const len = 2 * AC.sampleRate;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let l = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    l = (l + 0.04 * w) / 1.04;
    d[i] = l * 2.2;
  }
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 380;
  const g = AC.createGain(); g.gain.value = 0.05;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.14;
  const lfoG = AC.createGain(); lfoG.gain.value = 0.025;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(); lfo.start();
}
function plink(vol) {
  if (!soundOn || !AC) return;
  const o = AC.createOscillator();
  o.type = 'sine';
  const t0 = AC.currentTime;
  o.frequency.setValueAtTime(700 + Math.random() * 600, t0);
  o.frequency.exponentialRampToValueAtTime(240, t0 + 0.12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.12 * vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.22);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + 0.25);
}
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  sndBtn.textContent = soundOn ? 'Sound · on' : 'Sound · off';
  if (soundOn && !AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    buildAudio();
  }
  if (AC) { if (soundOn) AC.resume(); else AC.suspend(); }
});

/* ---------- world state: gusts breathe across the pond ---------- */
const windtag = document.getElementById('windtag');
let gustTarget = 0.9, gustTimer = 3;
let nextAuto = 2.5;
let windStr = '';

/* loop */
let rafId = null;
let last = performance.now();

function tick(dt, t) {
  simT = t;
  uniforms.uTime.value = t;

  /* gust scheduler — wind comes in breaths, not a constant stream */
  gustTimer -= dt;
  if (gustTimer <= 0) {
    const rising = gustTarget < 1.05;
    gustTarget = rising ? 1.15 + Math.random() * 0.5 : 0.75 + Math.random() * 0.2;
    gustTimer = rising ? 2.5 + Math.random() * 3 : 3.5 + Math.random() * 4;
  }
  gustAmp += (gustTarget - gustAmp) * Math.min(1, dt * 1.4);
  uniforms.uAmp.value = gustAmp;
  const ws = gustAmp > 1.25 ? 'gust' : gustAmp > 1.0 ? 'rising' : 'calm';
  if (ws !== windStr) { windStr = ws; windtag.textContent = 'wind · ' + ws; }

  /* breeze drops — the pond stirs itself when nobody is watching */
  if (t > nextAuto) {
    addRipple((Math.random() - 0.5) * 22, (Math.random() - 0.5) * 22, 0.03 + Math.random() * 0.04 * gustAmp);
    if (Math.random() < 0.5) plink(0.25);
    nextAuto = t + (1.6 + Math.random() * 2.6) / gustAmp;
  }

  /* camera — slow drift + pointer parallax */
  smx += (mx - smx) * 0.045;
  smy += (my - smy) * 0.045;
  radius += (targetR - radius) * 0.08;
  const theta = t * 0.045 + smx * 0.5;
  const phi = 0.58 - smy * 0.16;
  camera.position.set(
    Math.sin(theta) * radius * Math.cos(phi),
    Math.sin(phi) * radius,
    Math.cos(theta) * radius * Math.cos(phi)
  );
  camera.lookAt(0, 0.05, 0);

  /* lilies ride the same waves */
  for (const L of lilies) {
    const h = waveJS(L.x, L.z);
    const hx = waveJS(L.x + 0.3, L.z);
    const hz = waveJS(L.x, L.z + 0.3);
    L.grp.position.y = h + 0.02;
    L.grp.rotation.x = (hz - h) * 1.5;
    L.grp.rotation.z = -(hx - h) * 1.5;
    L.grp.rotation.y += dt * 0.02;
  }

  /* moon shimmer */
  moonGlow.material.opacity = 0.85 + Math.sin(t * 0.4) * 0.1;

  renderer.render(scene, camera);
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
