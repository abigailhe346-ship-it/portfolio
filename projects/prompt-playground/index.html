<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Chain — AGT—04</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<div class="topbar"><a href="../../index.html">← Index</a><span>AGT—04 · Prompt Chain</span></div>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#111114;color:#dcdbd6;font-family:'JetBrains Mono',monospace;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:#8be97e;color:#111114}
.layout{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:100vh;padding-top:52px;padding-bottom:44px}
.left{border-right:1px solid #1e1e24;overflow-y:auto;padding:20px 22px;scrollbar-width:thin}
.right{overflow-y:auto;padding:20px 26px 40px;scrollbar-width:thin;position:relative}
.sec-label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#55555e;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:#1e1e24}

/* step cards */
.step-card{border:1px solid #232329;border-radius:10px;background:#151519;margin-bottom:6px;overflow:hidden;transition:border-color .3s}
.step-card.active{border-color:#8be97e}
.step-card .sh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #1c1c21}
.step-card .num{width:18px;height:18px;border-radius:5px;background:#1e1e24;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8be97e}
.step-card .st{font-size:11.5px;font-weight:500;letter-spacing:.06em}
.step-card .mod{margin-left:auto;font-size:9px;color:#55555e;letter-spacing:.1em}
.ta-wrap{position:relative;font-size:11.5px;line-height:1.75}
.ta-wrap pre, .ta-wrap textarea{margin:0;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.ta-wrap pre{position:absolute;inset:0;pointer-events:none;color:#8a8894;overflow:hidden}
.ta-wrap pre .var{color:#8be97e;background:#8be97e14;border-radius:3px}
.ta-wrap textarea{position:relative;display:block;width:100%;min-height:96px;background:transparent;border:none;outline:none;resize:vertical;color:transparent;caret-color:#8be97e;overflow:hidden}
.temp-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #1c1c21;font-size:10px;color:#55555e}
.temp-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:#2a2a31;border-radius:1px;outline:none}
.temp-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#8be97e;cursor:pointer;border:none}
.temp-row input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#8be97e;cursor:pointer;border:none}
.temp-row .tv{color:#8be97e;min-width:26px;text-align:right}
.connector{display:flex;justify-content:center;padding:2px 0 8px;height:30px}
.connector svg{display:block}
.connector .flow{stroke-dasharray:4 5;animation:dashmove 1s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-9}}

/* right */
.run-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:7px;border:1px solid #8be97e;background:#8be97e14;color:#8be97e;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .25s}
.btn:hover{background:#8be97e;color:#111114}
.btn:disabled{opacity:.3;cursor:default;background:#8be97e14;color:#8be97e}
.btn.ghost{border-color:#2a2a31;color:#8a8894;background:transparent}
.btn.ghost:hover:not(:disabled){border-color:#8a8894;color:#dcdbd6;background:transparent}
.run-id{font-size:10px;color:#55555e;margin-left:auto}
.out-empty{font-size:11px;color:#3d3d46;font-style:italic;margin-top:8px}
.out-step{margin-bottom:26px;animation:oIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes oIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.out-head{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#55555e;margin-bottom:10px}
.out-head .dotp{width:7px;height:7px;border-radius:50%;background:#8be97e;animation:pp 1.2s ease-out infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 #8be97e66}100%{box-shadow:0 0 0 8px transparent}}
.out-head.done .dotp{animation:none;opacity:.5}
.out-head .meta{margin-left:auto;color:#3d3d46;letter-spacing:0;text-transform:none}
.out-body{font-size:11.5px;line-height:1.85;color:#b9b7b2;white-space:pre-wrap;word-break:break-word;border-left:1px solid #232329;padding-left:16px}
.out-body .cursor{display:inline-block;width:6px;height:12px;background:#8be97e;vertical-align:-1px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* compare */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
.cmp-col{border:1px solid #232329;border-radius:10px;overflow:hidden}
.cmp-col .ch{padding:9px 12px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #1c1c21}
.cmp-col.old .ch{color:#e06c6c;background:#e06c6c0d}
.cmp-col.new .ch{color:#8be97e;background:#8be97e0d}
.cmp-col .cb{padding:12px 14px;font-size:11px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:#8a8894}
.cmp-col .del{background:#e06c6c26;color:#e8a0a0;border-radius:3px;padding:0 2px;text-decoration:line-through;text-decoration-color:#e06c6c88}
.cmp-col .ins{background:#8be97e26;color:#b5f2ab;border-radius:3px;padding:0 2px}
.cmp-step-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#55555e;margin:0 0 10px}
.cmp-step-label span{color:#3d3d46}

/* stats bar */
#stats{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:90;display:flex;align-items:center;gap:0;background:#0d0d10;border-top:1px solid #1e1e24;font-size:10px;color:#55555e;padding:0 24px;overflow-x:auto}
#stats .cell{display:flex;align-items:center;gap:8px;padding-right:22px;margin-right:22px;border-right:1px solid #1e1e24;white-space:nowrap}
#stats .cell:last-child{border:none}
#stats b{color:#dcdbd6;font-weight:400}
#stats .ok{color:#8be97e}
.badge{position:fixed;bottom:56px;right:20px;z-index:99;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.22em;color:#4a4a52;border:1px solid #232329;padding:6px 12px;border-radius:20px;background:#111114cc;pointer-events:none}

@media(max-width:860px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;height:auto;padding-bottom:60px}
  .left{border-right:none;border-bottom:1px solid #1e1e24}
  .cmp-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
  <div class="left" id="leftPanel">
    <div class="sec-label">Chain Definition · 3 steps</div>
    <!-- step cards injected here -->
  </div>
  <div class="right" id="rightPanel">
    <div class="run-bar">
      <button class="btn" id="runBtn">▶ Run Chain</button>
      <button class="btn ghost" id="cmpBtn" disabled>⇄ Compare Runs</button>
      <span class="run-id" id="runId">no runs yet</span>
    </div>
    <div id="outWrap"><p class="out-empty">Chain output streams here. Run twice to unlock comparison.</p></div>
  </div>
</div>

<div id="stats">
  <span class="cell">status <b id="stStatus" class="ok">idle</b></span>
  <span class="cell">tokens <b id="stTok">0</b></span>
  <span class="cell">cost <b id="stCost">$0.0000</b></span>
  <span class="cell">latency <b id="stLat">0ms</b></span>
  <span class="cell">temp Σ <b id="stTemp">—</b></span>
</div>
<div class="badge">SIMULATED DATA</div>

<script>
(function(){
'use strict';
/* ============ chain definition ============ */
const STEPS = [
  { title:'extract_claims', model:'k2-large', temp:0.3,
    tpl:'You are an analyst. Extract the 3 strongest claims about {{topic}}.\nReturn one claim per line, no filler.' },
  { title:'critique_claims', model:'k2-large', temp:0.6,
    tpl:'You are a harsh critic. Attack each claim below on evidence and logic.\n\nClaims:\n{{step1_output}}\n\nBe specific, 2 sentences per claim.' },
  { title:'rewrite_thread', model:'k2-small', temp:0.8,
    tpl:'Rewrite the critique as a sharp social thread about {{topic}}.\n\nCritique:\n{{step2_output}}\n\nFormat: 3 numbered posts, each under 200 chars.' }
];

const left = document.getElementById('leftPanel');
const tas = [];
STEPS.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'step-card';
  card.innerHTML =
    '<div class="sh"><span class="num">' + (i+1) + '</span><span class="st">' + s.title + '</span><span class="mod">' + s.model + '</span></div>' +
    '<div class="ta-wrap"><pre></pre><textarea spellcheck="false"></textarea></div>' +
    '<div class="temp-row"><span>temp</span><input type="range" min="0" max="1" step="0.05" value="' + s.temp + '"><span class="tv">' + s.temp.toFixed(2) + '</span></div>';
  left.appendChild(card);
  const ta = card.querySelector('textarea');
  const pre = card.querySelector('pre');
  const range = card.querySelector('input');
  const tv = card.querySelector('.tv');
  ta.value = s.tpl;
  const paint = () => {
    pre.innerHTML = ta.value
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/\{\{[^}]*\}\}/g, m => '<span class="var">' + m + '</span>') + '\n';
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  };
  const syncScroll = () => { pre.scrollTop = ta.scrollTop; };
  ta.addEventListener('input', () => { s.tpl = ta.value; paint(); });
  ta.addEventListener('scroll', syncScroll);
  range.addEventListener('input', () => { s.temp = parseFloat(range.value); tv.textContent = s.temp.toFixed(2); });
  paint();
  tas.push(ta);
  if(i < 2){
    const c = document.createElement('div');
    c.className = 'connector';
    c.innerHTML = '<svg width="14" height="30" viewBox="0 0 14 30"><line class="flow" x1="7" y1="0" x2="7" y2="22" stroke="#3a3a44" stroke-width="1.4"/><path d="M3 19 L7 26 L11 19" fill="none" stroke="#3a3a44" stroke-width="1.4"/></svg>';
    left.appendChild(c);
  }
});

/* ============ simulated model ============ */
const pick = (arr, t) => arr[Math.min(arr.length-1, Math.floor(Math.random() * arr.length * (0.5 + t)))];
function genStep1(topic, t){
  const verbs = ['reshapes','accelerates','quietly dominates','redefines','outpaces'];
  const objs = ['legacy workflows','incumbent pipelines','the mid-market segment','procurement cycles','developer habits'];
  const evs = ['cohort data from Q3','three independent benchmarks','public filings','a 40-team field study','adoption curves'];
  const l1 = '• ' + topic + ' ' + pick(verbs,t) + ' ' + pick(objs,t) + ', per ' + pick(evs,t) + '.';
  const l2 = '• Retention is ' + (t > .5 ? pick(['the real moat','stickier than pricing suggests','driven by habit loops'],t) : 'driven by switching costs, not features') + '.';
  const l3 = '• ' + pick(['Margins compress as usage scales','Power users generate 80% of load','Distribution beats model quality','Latency, not accuracy, caps growth'],t) + '.';
  return l1 + '\n' + l2 + '\n' + l3;
}
function genStep2(prev, t){
  const openers = ['Claim 1 overstates the evidence:','Claim 1 is directionally right but sloppy:','Claim 1 confuses correlation with causation:'];
  const mids = ['one cohort is not a trend, and the baseline is cherry-picked.','the cited benchmark measures throughput, not outcomes.','survivorship bias inflates every number quoted.'];
  const c2 = ['Claim 2 ignores that switching costs fall every quarter as tooling standardizes.','Claim 2 never defines "retention" — daily actives and paid seats tell opposite stories.'];
  const c3 = ['Claim 3 is unfalsifiable as stated; name a metric or drop it.','Claim 3 holds only above a usage threshold nobody in the segment reaches.'];
  return pick(openers,t) + ' ' + pick(mids,t) + '\n' +
         pick(c2,t) + '\n' + pick(c3,t);
}
function genStep3(topic, prev, t){
  const h = ['1/ Everyone hyping ' + topic + ' is reading the same cherry-picked chart. The baseline matters more than the headline.',
             '1/ Hot take: ' + topic + ' discourse is one cohort study deep. Here is what the data actually says.',
             '1/ Before you bet the roadmap on ' + topic + ', three claims need a stress test.'];
  const m = ['2/ "Switching costs protect incumbents" — true in 2021, collapsing now as tooling standardizes. Moats have half-lives.',
             '2/ Retention numbers mean nothing until you define the denominator. Daily actives ≠ paid seats.',
             '2/ The retention argument is doing quiet heavy lifting — and it rests on undefined terms.'];
  const e = ['3/ If a claim can\'t name its metric, it isn\'t analysis — it\'s marketing. Demand the threshold.',
             '3/ Unfalsifiable claims are vibes with citations. Name the metric or drop the take.',
             '3/ Stress test passed by claim 2 only. The rest is narrative. Build accordingly.'];
  return pick(h,t) + '\n\n' + pick(m,t) + '\n\n' + pick(e,t);
}

/* ============ run ============ */
const outWrap = document.getElementById('outWrap');
const runBtn = document.getElementById('runBtn');
const cmpBtn = document.getElementById('cmpBtn');
const runIdEl = document.getElementById('runId');
const stStatus = document.getElementById('stStatus');
const stTok = document.getElementById('stTok');
const stCost = document.getElementById('stCost');
const stLat = document.getElementById('stLat');
const stTemp = document.getElementById('stTemp');
const stepCards = document.querySelectorAll('.step-card');

let runs = [], runCount = 0, running = false, cmpMode = false;
let hidden = false;
document.addEventListener('visibilitychange', () => { hidden = document.hidden; });
const waitVisible = () => new Promise(res => {
  const h = () => { if(!document.hidden){ document.removeEventListener('visibilitychange', h); res(); } };
  document.addEventListener('visibilitychange', h);
});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const topic = () => 'AI coding agents';

async function typeInto(el, text){
  const cur = document.createElement('span');
  cur.className = 'cursor';
  el.appendChild(cur);
  for(let i = 0; i < text.length; i++){
    if(hidden) await waitVisible();
    cur.insertAdjacentText('beforebegin', text[i]);
    if(i % 3 === 0) await sleep(10);
    el.closest('.right').scrollTop = 1e6;
  }
  cur.remove();
}

async function run(){
  if(running) return;
  running = true; cmpMode = false;
  runBtn.disabled = true; cmpBtn.disabled = true;
  runCount++;
  const rid = runCount;
  outWrap.innerHTML = '';
  stepCards.forEach(c => c.classList.remove('active'));
  stStatus.textContent = 'running #' + rid;
  const t0 = performance.now();
  const outputs = [];
  let tokens = 0;

  for(let i = 0; i < 3; i++){
    if(hidden) await waitVisible();
    stepCards[i].classList.add('active');
    const s = STEPS[i];
    const sec = document.createElement('div');
    sec.className = 'out-step';
    sec.innerHTML = '<div class="out-head"><span class="dotp"></span>step ' + (i+1) + ' · ' + s.title +
      '<span class="meta"></span></div><div class="out-body"></div>';
    outWrap.appendChild(sec);
    outWrap.closest('.right').scrollTop = 1e6;
    const s0 = performance.now();
    await sleep(320 + Math.random() * 300);

    let text;
    if(i === 0) text = genStep1(topic(), s.temp);
    else if(i === 1) text = genStep2(outputs[0], s.temp);
    else text = genStep3(topic(), outputs[1], s.temp);

    await typeInto(sec.querySelector('.out-body'), text);
    const ms = Math.round(performance.now() - s0);
    const tok = Math.round(text.split(/\s+/).length * 1.33 + s.tpl.split(/\s+/).length);
    tokens += tok;
    sec.querySelector('.out-head').classList.add('done');
    sec.querySelector('.meta').textContent = tok + ' tok · ' + ms + 'ms';
    stepCards[i].classList.remove('active');
    outputs.push(text);
  }

  const lat = Math.round(performance.now() - t0);
  stTok.textContent = tokens.toLocaleString();
  stCost.textContent = '$' + (tokens * 0.0000112).toFixed(4);
  stLat.textContent = lat + 'ms';
  stTemp.textContent = STEPS.map(s => s.temp.toFixed(2)).join(' / ');
  stStatus.textContent = 'done #' + rid;
  runIdEl.textContent = 'run #' + rid + ' · ' + new Date().toLocaleTimeString();
  runs.push({ id: rid, outputs, tokens, lat });
  if(runs.length > 2) runs.shift();
  if(runs.length === 2) cmpBtn.disabled = false;
  runBtn.disabled = false;
  running = false;
}

/* ============ word diff (LCS) ============ */
function diffWords(a, b){
  const A = a.split(/\s+/), B = b.split(/\s+/);
  const n = A.length, m = B.length;
  const dp = [];
  for(let i = 0; i <= n; i++){ dp[i] = new Uint16Array(m + 1); }
  for(let i = n - 1; i >= 0; i--)
    for(let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const oldHtml = [], newHtml = [];
  let i = 0, j = 0;
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  while(i < n && j < m){
    if(A[i] === B[j]){ oldHtml.push(esc(A[i])); newHtml.push(esc(B[j])); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ oldHtml.push('<span class="del">' + esc(A[i]) + '</span>'); i++; }
    else { newHtml.push('<span class="ins">' + esc(B[j]) + '</span>'); j++; }
  }
  while(i < n){ oldHtml.push('<span class="del">' + esc(A[i]) + '</span>'); i++; }
  while(j < m){ newHtml.push('<span class="ins">' + esc(B[j]) + '</span>'); j++; }
  return { oldHtml: oldHtml.join(' '), newHtml: newHtml.join(' ') };
}

function renderCompare(){
  if(runs.length < 2) return;
  cmpMode = true;
  outWrap.innerHTML = '';
  const [rOld, rNew] = runs;
  for(let i = 0; i < 3; i++){
    const lbl = document.createElement('div');
    lbl.className = 'cmp-step-label';
    lbl.innerHTML = 'step ' + (i+1) + ' · ' + STEPS[i].title + ' <span>· run #' + rOld.id + ' → #' + rNew.id + '</span>';
    outWrap.appendChild(lbl);
    const d = diffWords(rOld.outputs[i], rNew.outputs[i]);
    const grid = document.createElement('div');
    grid.className = 'cmp-grid';
    grid.innerHTML =
      '<div class="cmp-col old"><div class="ch">run #' + rOld.id + ' · before</div><div class="cb">' + d.oldHtml + '</div></div>' +
      '<div class="cmp-col new"><div class="ch">run #' + rNew.id + ' · after</div><div class="cb">' + d.newHtml + '</div></div>';
    outWrap.appendChild(grid);
  }
  const dt = rNew.tokens - rOld.tokens;
  stStatus.textContent = 'compare';
  stTok.textContent = rNew.tokens.toLocaleString() + ' (' + (dt >= 0 ? '+' : '') + dt + ')';
  stCost.textContent = '$' + (rNew.tokens * 0.0000112).toFixed(4);
  stLat.textContent = rOld.lat + '→' + rNew.lat + 'ms';
}
cmpBtn.addEventListener('click', () => {
  if(cmpMode){ // back to latest run view
    cmpMode = false;
    const last = runs[runs.length - 1];
    outWrap.innerHTML = '';
    last.outputs.forEach((text, i) => {
      const sec = document.createElement('div');
      sec.className = 'out-step';
      sec.innerHTML = '<div class="out-head done"><span class="dotp"></span>step ' + (i+1) + ' · ' + STEPS[i].title + '</div>' +
        '<div class="out-body"></div>';
      sec.querySelector('.out-body').textContent = text;
      outWrap.appendChild(sec);
    });
    stStatus.textContent = 'done #' + last.id;
    stTok.textContent = last.tokens.toLocaleString();
    stLat.textContent = last.lat + 'ms';
  } else renderCompare();
});
runBtn.addEventListener('click', run);
})();
</script>
</body>
</html>
