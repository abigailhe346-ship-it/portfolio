<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Type 3D — 3D—05</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#f5f2ec;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(30,28,24,.42);pointer-events:none;user-select:none;white-space:nowrap}
.tag{position:fixed;left:26px;bottom:26px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(30,28,24,.32);pointer-events:none;user-select:none}
.load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(30,28,24,.4);pointer-events:none;user-select:none;transition:opacity .6s ease}
.load.done{opacity:0}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>3D—05 · Kinetic Type 3D</span></div>
<canvas id="c"></canvas>
<div class="load" id="load">Loading type —</div>
<div class="tag">Orbital specimen — r / 4.6 · 6.9 · 9.2</div>
<div class="hint">click a word</div>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
const CAM_BASE = new THREE.Vector3(0, 7.2, 16.5);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 1.1, 0);

/* lighting — matte white type, crisp directional shadow */
const hemi = new THREE.HemisphereLight(0xffffff, 0xd9d2c4, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(7, 13, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13;
sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13;
sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 32;
sun.shadow.bias = -0.0004;
scene.add(sun);

/* shadow catcher over the paper background */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.ShadowMaterial({ opacity: 0.13 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* orbit ring guides */
const ringMat = new THREE.MeshBasicMaterial({ color: 0xd8d2c4 });
const ORBITS = [
  { word: 'CREATE', r: 4.6, speed: 0.32, y: 1.5, angle: 0 },
  { word: 'DESIGN', r: 6.9, speed: -0.21, y: 0.6, angle: 2.2 },
  { word: 'BUILD', r: 9.2, speed: 0.15, y: 2.3, angle: 4.3 }
];
const words = [];
const hitMeshes = [];

ORBITS.forEach(o => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(o.r, 0.012, 8, 180), ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = o.y;
  scene.add(ring);

  const grp = new THREE.Group();
  grp.rotation.y = o.angle;
  scene.add(grp);
  o.grp = grp;
  o.scale = 1;
  o.scaleV = 0;
  o.spinBoost = 0;
  words.push(o);
});

const wordMat = new THREE.MeshStandardMaterial({ color: 0xfdfcf9, roughness: 0.9, metalness: 0 });

const loadEl = document.getElementById('load');
new FontLoader().load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  font => {
    words.forEach(o => {
      const geo = new TextGeometry(o.word, {
        font, size: 1.05, height: 0.42, curveSegments: 8,
        bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 2
      });
      geo.center();
      const mesh = new THREE.Mesh(geo, wordMat);
      mesh.castShadow = true;
      mesh.position.set(o.r, o.y, 0);
      mesh.rotation.y = Math.PI / 2; // text faces radially outward
      o.grp.add(mesh);
      o.mesh = mesh;
      hitMeshes.push(mesh);
    });
    loadEl.classList.add('done');
  },
  undefined,
  () => { loadEl.textContent = 'Font failed to load'; }
);

/* pointer: parallax + click impulse */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let mx = 0, my = 0, smx = 0, smy = 0;

window.addEventListener('pointermove', e => {
  mx = (e.clientX / window.innerWidth) * 2 - 1;
  my = (e.clientY / window.innerHeight) * 2 - 1;
  if (hitMeshes.length) {
    ndc.set(mx, -my);
    ray.setFromCamera(ndc, camera);
    canvas.style.cursor = ray.intersectObjects(hitMeshes, false).length ? 'pointer' : 'default';
  }
}, { passive: true });

canvas.addEventListener('pointerdown', e => {
  if (!hitMeshes.length) return;
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -((e.clientY / window.innerHeight) * 2 - 1));
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(hitMeshes, false);
  if (hits.length) {
    const o = words.find(w => w.mesh === hits[0].object);
    if (o) {
      o.scaleV += 4.2;
      o.spinBoost = 5.5;
    }
  }
});

/* loop */
let rafId = null;
let last = performance.now();

function tick(dt) {
  smx += (mx - smx) * 0.05;
  smy += (my - smy) * 0.05;
  camera.position.set(CAM_BASE.x + smx * 2.2, CAM_BASE.y - smy * 1.3, CAM_BASE.z);
  camera.lookAt(0, 1.1, 0);

  words.forEach(o => {
    if (!o.mesh) return;
    o.spinBoost *= Math.exp(-1.9 * dt);
    o.grp.rotation.y += (o.speed + o.spinBoost * Math.sign(o.speed)) * dt;
    // spring scale back to 1
    const acc = (1 - o.scale) * 38 - o.scaleV * 6.5;
    o.scaleV += acc * dt;
    o.scale += o.scaleV * dt;
    o.scale = Math.min(1.8, Math.max(0.6, o.scale));
    o.mesh.scale.setScalar(o.scale);
  });

  renderer.render(scene, camera);
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tick(dt);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
