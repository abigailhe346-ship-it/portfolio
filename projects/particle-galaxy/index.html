<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Galaxy — 3D—04</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{height:400vh;background:#000;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;pointer-events:none}
.center-hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;user-select:none;z-index:5}
.center-hint h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(40px,6vw,84px);color:#f4f1ea;line-height:1}
.center-hint p{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(244,241,234,.45)}
.progress{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.26em;color:rgba(255,255,255,.5);pointer-events:none;user-select:none;z-index:5}
.bar{position:fixed;left:0;bottom:0;height:2px;width:100%;background:rgba(255,255,255,.07);z-index:5;pointer-events:none}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffe9b8,#6b4dff)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>3D—04 · Particle Galaxy</span></div>
<canvas id="c"></canvas>
<div class="center-hint" id="hint"><h1>Traverse</h1><p>scroll to travel</p></div>
<div class="progress" id="pct">000%</div>
<div class="bar"><i id="barFill"></i></div>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.05, 400);

/* 100k-particle logarithmic spiral galaxy */
const COUNT = 100000;
const RADIUS = 22;
const ARMS = 4;
const SPIN = 0.24;

const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const sizes = new Float32Array(COUNT);

const cIn = new THREE.Color(0xffedc0);
const cMid = new THREE.Color(0xc7a6ff);
const cOut = new THREE.Color(0x6b4dff);
const tmp = new THREE.Color();

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

for (let i = 0; i < COUNT; i++) {
  const r = Math.pow(Math.random(), 1.65) * RADIUS;
  const branch = (i % ARMS) / ARMS * Math.PI * 2;
  const spinA = r * SPIN;
  const spread = (0.32 + r * 0.055) * (0.55 + Math.pow(Math.random(), 2.5) * 1.5);
  const gx = gauss() * spread;
  const gy = gauss() * spread * 0.38;
  const gz = gauss() * spread;
  positions[i * 3] = Math.cos(branch + spinA) * r + gx;
  positions[i * 3 + 1] = gy;
  positions[i * 3 + 2] = Math.sin(branch + spinA) * r + gz;

  const t = Math.pow(r / RADIUS, 1.15);
  if (t < 0.42) tmp.lerpColors(cIn, cMid, t / 0.42);
  else tmp.lerpColors(cMid, cOut, (t - 0.42) / 0.58);
  const jitter = 0.88 + Math.random() * 0.24;
  colors[i * 3] = tmp.r * jitter;
  colors[i * 3 + 1] = tmp.g * jitter;
  colors[i * 3 + 2] = tmp.b * jitter;

  sizes[i] = 0.05 + Math.pow(Math.random(), 3.2) * 0.24;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

const galaxyMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 1 } },
  vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    uniform float uScale;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float ps = aSize * uScale / max(0.1, -mv.z);
      gl_PointSize = min(ps, 30.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = distance(gl_PointCoord, vec2(0.5));
      float a = pow(smoothstep(0.5, 0.0, d), 2.1);
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const galaxy = new THREE.Points(geo, galaxyMat);
galaxy.rotation.z = 0.1;
scene.add(galaxy);

/* scroll-driven camera */
const pctEl = document.getElementById('pct');
const barFill = document.getElementById('barFill');
const hintEl = document.getElementById('hint');
let target = 0;
let prog = 0;

function readScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  target = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
}
window.addEventListener('scroll', readScroll, { passive: true });
readScroll();

function updateUScale() {
  galaxyMat.uniforms.uScale.value = (window.innerHeight * DPR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
}
updateUScale();

/* loop */
let rafId = null;
let last = performance.now();

function tick(dt, t) {
  prog += (target - prog) * (1 - Math.pow(0.0001, dt)); // critically smooth
  const s = prog * prog * (3 - 2 * prog);

  const camZ = 36 - 72 * s;
  const camY = 17 - Math.sin(s * Math.PI) * 15.6;
  const camX = Math.sin(s * Math.PI * 2) * 1.6;
  const bump = Math.exp(-Math.pow((s - 0.5) * 4.2, 2));
  camera.fov = 58 + 38 * bump;
  camera.updateProjectionMatrix();
  updateUScale();
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, 0, 0);

  galaxy.rotation.y = t * 0.045;

  const pct = Math.round(prog * 100);
  pctEl.textContent = String(pct).padStart(3, '0') + '%';
  barFill.style.width = (prog * 100).toFixed(1) + '%';
  hintEl.style.opacity = Math.max(0, 1 - prog * 14).toFixed(3);

  renderer.render(scene, camera);
}
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else if (rafId === null) {
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateUScale();
  readScroll();
});

rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
