<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 22 C 10 14, 20 8, 28 7 C 24 12, 14 20, 5 24 Z%27 fill=%27%23c8442a%27/%3E%3C/svg%3E"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed')</script><style>.embed .topbar,.embed .signet{display:none!important}</style>
<title>Plein Air — No.03 · Sky Studies</title>
<style>
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;pointer-events:none}
.topbar a{color:#fff;text-decoration:none;pointer-events:auto}
.topbar a:hover{text-decoration:underline}
</style>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1c2340}
canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.title{position:fixed;left:24px;top:62px;z-index:10;pointer-events:none;mix-blend-mode:difference}
.title h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(26px,3.6vw,48px);color:#fff;margin:0;line-height:1.05}
.title p{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:8px 0 0}
.hud{position:fixed;right:24px;top:62px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);text-align:right;pointer-events:none;line-height:1.9;mix-blend-mode:difference}
.hint{position:fixed;left:24px;bottom:58px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none;line-height:1.9;mix-blend-mode:difference}
.timeline{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;width:min(640px,72vw)}
.timeline button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);background:none;border:1px solid rgba(255,255,255,.3);padding:6px 10px;cursor:pointer;mix-blend-mode:difference;white-space:nowrap}
.timeline button:hover{border-color:#fff;color:#fff}
#time{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
#time::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.35)}
#time::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#e8e4d8;margin-top:-6px;box-shadow:0 0 8px rgba(232,228,216,.7)}
#time::-moz-range-track{height:1px;background:rgba(255,255,255,.35)}
#time::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#e8e4d8}
.signet{position:fixed;right:22px;bottom:16px;z-index:90;display:flex;align-items:center;gap:10px;pointer-events:none}
.signet svg{width:38px;height:38px;display:block}
.signet span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c8442a;opacity:.92}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
@media (max-width:760px){.hint{display:none}.hud{top:112px}}
</style>
</head>
<body>
<div class="topbar"><a href="../../index.html">← Index</a><span>Plein Air — No.03</span></div>
<canvas id="c"></canvas>
<div class="title"><h1>Sky Studies</h1><p>Domain-warped clouds — five Monet palettes, one day</p></div>
<div class="hud" id="hud"></div>
<div class="hint">drag — smear cloud wisps · slider — scrub the day<br>1–5 — palette moment · space — pause · E — export PNG</div>
<div class="timeline">
  <button id="play">pause</button>
  <input type="range" id="time" min="0" max="1000" value="140">
  <button id="export">export png</button>
</div>
<div class="signet">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M12 44c1-12 8-26 22-31 8-3 16-2 20 2-7 1-14 6-19 13-6 8-9 17-16 20-4 2-7-1-7-4z" fill="#c8442a" opacity=".92"/>
    <path d="M14 53c9-2 22-5 32-13-3 7-15 14-27 15-5 .5-7-1-5-2z" fill="#c8442a" opacity=".55"/>
    <path d="M10 36c3-3 9-4 13-3-2 4-9 6-13 5-3-.6-3-1 0-2z" fill="#c8442a" opacity=".32"/>
  </svg>
  <span>Plein Air — No.03</span>
</div>
<svg class="grain" aria-hidden="true"><filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainF)"/></svg>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),hud=document.getElementById('hud');
var slider=document.getElementById('time'),playBtn=document.getElementById('play'),expBtn=document.getElementById('export');
var isMobile=(navigator.maxTouchPoints>0&&Math.min(innerWidth,innerHeight)<820)||Math.min(innerWidth,innerHeight)<640;
var gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
if(!gl){document.body.innerHTML='<p style="color:#fff;font-family:monospace;padding:40px">WebGL unavailable.</p>';return}

/* ---------- palettes along one day ---------- */
function hx(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
var KEYS=[
 {at:0,   name:'Fog — Morning Mist',  sky:'#dfe3da',cloud:'#f2ede0',light:'#f5f0e0',shadow:'#9fb2a8'},
 {at:.22, name:'Poplars — Late Morning',sky:'#b7cdd3',cloud:'#ece3c8',light:'#f5d98a',shadow:'#7ba05b'},
 {at:.45, name:'Haystack — Gold Hour', sky:'#f2e8cf',cloud:'#f5dfae',light:'#d9a441',shadow:'#8d7fb8'},
 {at:.68, name:'Waterlily — Pond Dusk',sky:'#7ba8a0',cloud:'#e8b7c3',light:'#e8b7c3',shadow:'#2e4a3f'},
 {at:.86, name:'Twilight — Night Blue',sky:'#4a5a8a',cloud:'#2a3560',light:'#e07b39',shadow:'#1c2340'},
 {at:1,   name:'Fog — Morning Mist',  sky:'#dfe3da',cloud:'#f2ede0',light:'#f5f0e0',shadow:'#9fb2a8'}
];
KEYS.forEach(function(k){k.skyN=hx(k.sky);k.cloudN=hx(k.cloud);k.lightN=hx(k.light);k.shadowN=hx(k.shadow)});
function mix3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function paletteAt(day,out){
  var i=0;
  while(i<KEYS.length-2&&day>KEYS[i+1].at)i++;
  var a=KEYS[i],b=KEYS[i+1],t=(day-a.at)/Math.max(.0001,b.at-a.at);
  t=Math.max(0,Math.min(1,t));
  out.sky=mix3(a.skyN,b.skyN,t);out.cloud=mix3(a.cloudN,b.cloudN,t);
  out.light=mix3(a.lightN,b.lightN,t);out.shadow=mix3(a.shadowN,b.shadowN,t);
  out.name=(t<.5?a:b).name;
  return out;
}

/* ---------- shaders ---------- */
var OCT=isMobile?4:5;
var vsrc='attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}';
var fsrc=[
'precision highp float;',
'uniform vec2 uRes;uniform float uTime;',
'uniform vec3 uSky;uniform vec3 uCloud;uniform vec3 uLight;uniform vec3 uShadow;',
'uniform vec2 uSun;uniform float uSunA;',
'uniform vec4 uSm[8];uniform vec2 uSmD[8];',
'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<'+OCT+';i++){v+=a*vnoise(p);p=p*2.03+vec2(1.7,4.1);a*=.5;}return v;}',
'void main(){',
' vec2 uv=gl_FragCoord.xy/uRes;',
' vec2 p=(uv-.5)*vec2(uRes.x/uRes.y,1.)*2.4;',
' float t=uTime;',
' vec2 sm=vec2(0.);',
' for(int i=0;i<8;i++){',
'   float age=t-uSm[i].z;',
'   if(age>0.&&age<4.){',
'     vec2 d=p-uSm[i].xy;',
'     float infl=exp(-dot(d,d)*5.)*uSm[i].w*exp(-age*1.1);',
'     sm+=infl*(uSmD[i]*1.4+vec2(-d.y,d.x)*2.);',
'   }',
' }',
' vec2 bp=p*.9;',
' vec2 q=vec2(fbm(bp+vec2(t*.03,0.)),fbm(bp+vec2(5.2,1.3)-vec2(0.,t*.02)));',
' vec2 r=vec2(fbm(bp+2.0*q+vec2(1.7,9.2)+vec2(t*.05,0.)),fbm(bp+2.0*q+vec2(8.3,2.8)));',
' float v=fbm(bp+2.6*r+sm*1.6);',
' v+=(.55-uv.y)*.16;',
' vec3 col=mix(uShadow,uSky,smoothstep(-.1,1.05,uv.y));',
' float cl=smoothstep(.38,.72,v);',
' col=mix(col,uCloud,cl*.9);',
' float lit=smoothstep(.55,.95,v)*(.4+.6*q.y);',
' col=mix(col,uLight,lit*.5);',
' float sd=length(uv-uSun);',
' col+=uLight*exp(-sd*7.)*uSunA;',
' float edge=smoothstep(.035,0.,abs(v-.45))+smoothstep(.03,0.,abs(v-.60))+smoothstep(.028,0.,abs(v-.74));',
' col*=1.-edge*.13;',
' col*=1.+(hash(gl_FragCoord.xy*.7)-.5)*.07;',
' float vig=smoothstep(1.25,.45,length(uv-.5)*1.3);',
' col*=mix(.85,1.,vig);',
' gl_FragColor=vec4(col,1.);',
'}'
].join('\n');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s)||'shader error')}
  return s}
var prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vsrc));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fsrc));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error('link failed');
gl.useProgram(prog);
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var aPos=gl.getAttribLocation(prog,'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
var U={};
['uRes','uTime','uSky','uCloud','uLight','uShadow','uSun','uSunA','uSm[0]','uSmD[0]'].forEach(function(n){U[n]=gl.getUniformLocation(prog,n)});

/* ---------- smear impulses ---------- */
var smears=new Float32Array(32),smearDirs=new Float32Array(16),smearIdx=0;
function addSmear(px,py,dx,dy){
  var aspect=W/H;
  var ux=px/W,uy=1-py/H;
  var sx=(ux-.5)*aspect*2.4,sy=(uy-.5)*2.4;
  var sp=Math.sqrt(dx*dx+dy*dy)||1;
  var i=smearIdx%8;
  smears[i*4]=sx;smears[i*4+1]=sy;smears[i*4+2]=simT;smears[i*4+3]=Math.min(1.2,sp/24);
  smearDirs[i*2]=(dx/sp)*aspect*.1;smearDirs[i*2+1]=-(dy/sp)*.1;
  smearIdx++;
}

/* ---------- day state ---------- */
var day=.14,playing=true,idleT=0,simT=0;
var pal={sky:null,cloud:null,light:null,shadow:null,name:''};
function setDay(d,fromUser){
  day=((d%1)+1)%1;
  slider.value=Math.round(day*1000);
  if(fromUser){playing=false;idleT=0;playBtn.textContent='play'}
}
slider.addEventListener('input',function(){setDay(slider.value/1000,true)});
playBtn.addEventListener('click',function(){playing=!playing;playBtn.textContent=playing?'pause':'play'});
function exportPNG(){
  render();
  var a=document.createElement('a');
  a.download='sky-study-'+Date.now()+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}
expBtn.addEventListener('click',exportPNG);
addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();playing=!playing;playBtn.textContent=playing?'pause':'play'}
  else if(e.key==='e'||e.key==='E')exportPNG();
  else if(e.key==='ArrowLeft')setDay(day-.02,true);
  else if(e.key==='ArrowRight')setDay(day+.02,true);
  else if(e.key>='1'&&e.key<='5')setDay(KEYS[+e.key-1].at,true);
});

/* ---------- pointer smear ---------- */
var lastP=null;
canvas.addEventListener('pointerdown',function(e){lastP=[e.clientX,e.clientY]});
canvas.addEventListener('pointermove',function(e){
  if(!lastP)return;
  var dx=e.clientX-lastP[0],dy=e.clientY-lastP[1];
  if(dx*dx+dy*dy>36){addSmear(e.clientX,e.clientY,dx,dy);lastP=[e.clientX,e.clientY]}
});
canvas.addEventListener('pointerup',function(){lastP=null});
canvas.addEventListener('pointercancel',function(){lastP=null});

/* ---------- render ---------- */
var W=0,H=0,SCALE=isMobile?.65:1,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2)*SCALE;
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize);
resize();

function render(){
  paletteAt(day,pal);
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform1f(U.uTime,simT);
  gl.uniform3fv(U.uSky,pal.sky);
  gl.uniform3fv(U.uCloud,pal.cloud);
  gl.uniform3fv(U.uLight,pal.light);
  gl.uniform3fv(U.uShadow,pal.shadow);
  var sy=.22+.5*Math.sin(Math.PI*Math.min(.98,Math.max(.02,day)));
  gl.uniform2f(U.uSun,.12+.76*day,sy);
  gl.uniform1f(U.uSunA,.18+.4*Math.sin(Math.PI*day));
  gl.uniform4fv(U['uSm[0]'],smears);
  gl.uniform2fv(U['uSmD[0]'],smearDirs);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- HUD ---------- */
var hudT=0;
function hudTick(dt){
  hudT-=dt;if(hudT>0)return;hudT=.2;
  var hh=Math.floor(5+day*18),mm=Math.floor(((5+day*18)%1)*60);
  hud.innerHTML=pal.name+'<br>'+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+
    '<br>'+(playing?'day passing ▸':'held ⏸');
}

/* ---------- loop / lifecycle ---------- */
var raf=null,last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;simT+=dt;
  if(playing)day=(day+dt/150)%1;
  else{idleT+=dt;if(idleT>12){playing=true;playBtn.textContent='pause'}}
  if(playing)slider.value=Math.round(day*1000);
  render();
  hudTick(dt);
  raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null}
  else{last=performance.now();if(!raf)raf=requestAnimationFrame(frame)}
});
raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
